  else if(proposal.target==='requirements'){table='cp_requirements';rows=proposal.items.map(x=>({...base,title:x.title||'Requisito',description:x.description||'',requirement_type:['functional','non_functional','constraint'].includes(x.requirement_type)?x.requirement_type:'functional',priority:['low','medium','high','critical'].includes(x.priority)?x.priority:'medium',mandatory:x.mandatory!==false,status:'draft'}))}
  else if(proposal.target==='design'){table='cp_design_items';rows=proposal.items.map(x=>{const map={component:'architecture',data:'database',note:'other'};const allowed=['architecture','database','roles','permissions','api','integration','interface','other'];const type=map[x.item_type]||x.item_type;return {...base,item_type:allowed.includes(type)?type:'other',title:x.title||'Elemento di progetto',content:x.content||''}})}
  else if(proposal.target==='flow'){table='cp_flow_items';rows=proposal.items.map((x,i)=>({...base,code:'FLOW-'+Date.now()+'-'+(i+1),title:x.title||'Flusso',description:x.description||'',pseudocode:x.pseudocode||'',rules:Array.isArray(x.rules)?x.rules:[],version:1,is_current:true}))}
  else if(proposal.target==='tests'){table='cp_problem_tests';rows=proposal.items.map((x,i)=>({...base,code:'TEST-'+Date.now()+'-'+(i+1),title:x.title||'Test',conditions:x.conditions||'',steps:Array.isArray(x.steps)?x.steps:[],expected_result:x.expected_result||'',status:'not_run'}))}
  if(!table||!rows.length){alert('Questa proposta non può essere salvata automaticamente.');return}
  const {data:created,error}=await SB.from(table).insert(rows).select('id');if(error){console.error(error);alert('Errore nel salvataggio della proposta AI: '+(error.message||'controlla i dati proposti.'));return}
  if(activeSuggestionId){
    await SB.from('cp_ai_suggestions').update({status:'approved',approved_at:new Date().toISOString(),approved_by:authUser?.id||null,resulting_record_id:created?.[0]?.id||null}).eq('id',activeSuggestionId);
    for(const m of v13AiHistory)if(m.suggestion?.id===activeSuggestionId)m.suggestion.status='approved';
  }
  v13AiLast=null;v13AiSuggestionId=null;v13AiRenderHistory();
}

function newProject(){
  if(!cur)return;
  if(cur.archived)return alert('Riattiva prima il cliente.');
  show(`<h2>Nuovo progetto</h2><label>Nome *</label><input id=pn><label>Descrizione</label><textarea id=pdesc></textarea><label>Stato</label><select id=pstate><option>Da fare</option><option>In corso</option><option>Da far provare</option><option>Modifiche richieste</option></select><button class=primary onclick=saveProject()>Crea progetto</button>`)
}
function saveProject(){
  if(!pn.value.trim())return alert('Inserisci il nome del progetto.');
  const p={id:crypto.randomUUID(),name:pn.value.trim(),description:pdesc.value,status:pstate.value,startedAt:new Date().toISOString(),completedAt:'',relationType:'new',parentProjectId:'',closures:[]};
  cur.projects.push(p);cur.status='Progetto attivo';logEvent(cur.id,'Creato progetto “'+p.name+'”',p.id);save();modal.close();renderClient()
}
function openProject(projectId){
  if(!cur)return;
  const p=projectById(cur,projectId);if(!p)return;
  ensureProjectData(p,cur);activeProjectId=p.id;syncTimeContext();
  const parent=p.parentProjectId?projectById(cur,p.parentProjectId):null;
  const closures=(p.closures||[]).slice().reverse();
  const projectEvents=db.history.filter(h=>h.clientId===cur.id&&h.projectId===p.id).slice(0,12);
  const pTasks=db.tasks.filter(t=>t.clientId===cur.id&&t.projectId===p.id);
  const tracked=projectTimeMs(cur,p);
  const ro=!!cur.archived;
  show(`<div class=modalHead><div><h2>${esc(p.name)}</h2><div class=mut>${projectLabel(p)}${parent?' · collegato a '+esc(parent.name):''}</div></div><button class=modalClose onclick="closeProjectModal()" aria-label="Chiudi">×</button></div>
  <label>Descrizione</label><textarea id=projDesc ${ro?'disabled':''}>${esc(p.description||'')}</textarea><label>Stato</label><select id=projState ${ro?'disabled':''}>${['Da fare','In corso','Da far provare','Modifiche richieste','Completato'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select>
  <div class=summaryGrid><div class=summaryBox><small>Tempo tracciato</small><b>${formatDuration(tracked)}</b></div><div class=summaryBox><small>Tariffa attuale</small><b>${Number(cur.hourlyRate)?moneyFmt(cur.hourlyRate)+'/h':'—'}</b></div><div class=summaryBox><small>Attività</small><b>${pTasks.length}</b></div><div class=summaryBox><small>Consuntivi</small><b>${closures.length}</b></div></div>
  <div class=softActions>${ro?`<button onclick="closeProjectModal()">Chiudi</button>`:`<button class=primary onclick="saveProjectEdit('${p.id}')">Salva modifiche</button><button onclick="newTask('${cur.id}','${p.id}')">＋ Attività collegata</button>${p.status!=='Completato'?`<button onclick="prepareCloseProject('${p.id}')">✓ Concludi lavoro</button>`:`<button onclick="reopenProjectDirect('${p.id}')">↶ Riapri progetto</button>`}`}</div>
  <div class=section>CONSUNTIVI</div>${closures.length?closures.map(s=>closureSummaryHTML(cur,p,s)).join(''):'<div class=mut>Nessun consuntivo ancora.</div>'}
  <div class=section>STORICO PROGETTO</div>${projectEvents.length?projectEvents.map(h=>`<div class=item><b>${esc(h.text)}</b><div class=mut>${fmt(h.date)}</div></div>`).join(''):'<div class=mut>Nessun evento specifico.</div>'}`)
}
function closeProjectModal(){activeProjectId='';modal.close();syncTimeContext()}
function saveProjectEdit(id){
  const p=projectById(cur,id);if(!p)return;
  const old=p.status;p.description=projDesc.value;p.status=projState.value;
  if(old!==p.status)logEvent(cur.id,'Progetto “'+p.name+'” → '+p.status,p.id);
  save();closeProjectModal();renderClient()
}
function reopenProjectDirect(id){
  const p=projectById(cur,id);if(!p)return;
  p.status='In corso';p.completedAt='';if(cur.archived){cur.archived=false;cur.archivedAt='';cur.status='Progetto attivo'}
  logEvent(cur.id,'Riaperto progetto “'+p.name+'”',p.id);save();closeProjectModal();renderClient()
}
function prepareCloseProject(id){
  closeTimeSession('chiusura-progetto');
  const p=projectById(cur,id);if(!p)return;
  const autoMs=projectTimeMs(cur,p),hours=(autoMs/3600000);
  const rate=Number(cur.hourlyRate)||0,estimated=hours*rate;
  show(`<h2>Concludi lavoro</h2><p><b>${esc(p.name)}</b></p><p class=mut>Il consuntivo viene salvato nello storico e non verrà ricalcolato quando cambierai tariffa.</p>
  <label>Ore da consuntivare</label><input id=closeHours type=number min=0 step=0.25 value="${hours?hours.toFixed(2):'0'}"><label>Tariffa €/ora</label><input id=closeRate type=number min=0 step=0.5 value="${rate||0}">
  <label>Importo concordato (facoltativo)</label><input id=closeAgreed type=number min=0 step=0.01 placeholder="${estimated.toFixed(2)}"><label>Importo già incassato (facoltativo)</label><input id=closeCollected type=number min=0 step=0.01 placeholder="0">
  <label>Risultato / note finali</label><textarea id=closeResult placeholder="Cosa è stato consegnato o risolto?"></textarea>
  <button class=primary onclick="finalizeProject('${p.id}')">Salva consuntivo e concludi</button>`)
}
function finalizeProject(id){
  const p=projectById(cur,id);if(!p)return;
  const h=Math.max(0,Number(closeHours.value)||0),rate=Math.max(0,Number(closeRate.value)||0),durationMs=Math.round(h*3600000),estimatedValue=h*rate;
  const agreed=closeAgreed.value===''?'':Math.max(0,Number(closeAgreed.value)||0),collected=closeCollected.value===''?0:Math.max(0,Number(closeCollected.value)||0);
  const resolved=(cur.problems||[]).filter(x=>x.status==='Risolto').map(x=>x.title);
  const doneTasks=db.tasks.filter(t=>t.clientId===cur.id&&t.projectId===p.id&&t.done).map(t=>t.title);
  const snap={id:crypto.randomUUID(),startedAt:p.startedAt||new Date().toISOString(),closedAt:new Date().toISOString(),durationMs,hourlyRate:rate,estimatedValue,agreedAmount:agreed,collectedAmount:collected,result:closeResult.value,resolvedProblems:resolved,completedTasks:doneTasks};
  p.closures=p.closures||[];p.closures.push(snap);p.status='Completato';p.completedAt=snap.closedAt;
  logEvent(cur.id,`Concluso progetto “${p.name}” · ${formatDuration(durationMs)} · ${moneyFmt(estimatedValue)}`,p.id);
  save();modal.close();activeProjectId='';tab='projects';renderClient();syncTimeContext()
}
function newTask(cid='',projectId=''){
  const clientOptions=db.clients.filter(c=>!c.archived||c.id===cid);
  show(`<h2>Nuova attività</h2><label>Titolo *</label><input id=tt><label>Cliente</label><select id=tc onchange=refreshTaskProjects()><option value="">Nessuno</option>${clientOptions.map(c=>`<option value="${c.id}" ${cid===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label>Progetto (facoltativo)</label><select id=tp><option value="">Nessun progetto</option></select><label>Scadenza</label><input type=date id=td><button class=primary onclick=saveTask()>Aggiungi</button>`);
  setTimeout(()=>{refreshTaskProjects(projectId)},0)
}
function refreshTaskProjects(selected=''){
  const sel=document.getElementById('tp');if(!sel)return;const c=db.clients.find(x=>x.id===tc.value);
  sel.innerHTML='<option value="">Nessun progetto</option>'+(c?(c.projects||[]).map(p=>`<option value="${p.id}" ${selected===p.id?'selected':''}>${esc(p.name)}</option>`).join(''):'')
}
function saveTask(){if(!tt.value.trim())return;db.tasks.push({id:crypto.randomUUID(),title:tt.value,clientId:tc.value,projectId:tp?.value||'',date:td.value,done:false});if(tc.value)logEvent(tc.value,'Creata attività “'+tt.value+'”',tp?.value||'');save();modal.close();cur?renderClient():go('tasks')}
function toggleTask(id){let t=db.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;if(t.clientId)logEvent(t.clientId,(t.done?'Completata':'Riaperta')+' attività “'+t.title+'”',t.projectId||'');save();cur?renderClient():go('tasks')}
function addDemo(){if(db.clients.length)return;let id=crypto.randomUUID();db.clients.push({id,name:'Studio Demo',contact:'Mario Rossi',phone:'333 1234567',email:'demo@example.it',sector:'Servizi',notes:'Cliente dimostrativo per provare ClientPro.',status:'Analisi',next:'Completare intervista',problems:[{title:'Gestione scorte',description:'Alcuni materiali finiscono senza preavviso.',priority:'Alta',solution:'',status:'Da analizzare'}],projects:[]});db.tasks.push({id:crypto.randomUUID(),title:'Completare intervista',clientId:id,date:'',done:false});logEvent(id,'Cliente demo creato');save()}

const publicId=new URLSearchParams(location.search).get('questionario');
(async()=>{
  if(publicId){
    title.textContent='Questionario cliente';
    crumb.textContent='ClientPro / Questionario';
    view.innerHTML='<div class="card empty">Caricamento questionario…</div>';
    const info=await loadPublicQuestionnaire(publicId);
    if(!info){
      view.innerHTML='<div class="card empty">Questionario non disponibile. Controlla il link ricevuto.</div>';
      return;
    }
    cur={name:info.client_name||'Questionario',contact:info.contact_name||'',questionnaire:{answers:{},notes:{}}};
    renderSelfQuestionnaire(true);
    return;
  }

  if(backendReady()){
    const {data}=await SB.auth.getSession();
    const recoveryRequested=new URLSearchParams(location.search).get('recovery')==='1';
    if(recoveryRequested && data.session){showRecoveryPassword();return}
    if(!data.session){showAuth('login');return}
    authUser=data.session.user;
    await ensureWorkspace();
    await loadCloudState();
  }

  ensureAllData();localStorage.setItem(STORE,JSON.stringify(db));
  recoverTimeSession();

  appRoutingEnabled=true;
  try{history.replaceState({view:'section',page:'home'},'')}catch(e){}
  applyTheme();
  updateAccountUI();
  lastSyncAt=backendReady()?new Date():null;
  setSyncState(backendReady()?'ok':'local');
  go('home',false);
})();
if(backendReady()){
  SB.auth.onAuthStateChange((event,session)=>{
    if(session?.user){authUser=session.user;updateAccountUI()}
    if(event==='SIGNED_OUT'){authUser=null;setSyncState('error')}
  });
}
['pointerdown','keydown','input','touchstart','scroll'].forEach(type=>document.addEventListener(type,noteUserActivity,{passive:true,capture:true}));
window.addEventListener('focus',()=>{noteUserActivity();if(backendReady()&&authUser&&!localDirty)syncNow(false)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){closeTimeSession('pagina-nascosta');if(backendReady()&&authUser)saveCloudState(true)}else{syncTimeContext();if(backendReady()&&authUser&&!localDirty)syncNow(false)}});
window.addEventListener('pagehide',()=>{closeTimeSession('chiusura-pagina');if(backendReady()&&authUser)saveCloudState(true)});
modal.addEventListener('close',()=>{if(activeProjectId){activeProjectId='';syncTimeContext()}});
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(console.warn);
