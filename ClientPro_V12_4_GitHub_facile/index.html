<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClientPro</title><meta name="theme-color" content="#06101d"><meta name="description" content="ClientPro - gestione clienti, analisi, problemi, progetti e attività"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --bg:#07111f;
  --bg2:#0a1525;
  --sidebar:#081423;
  --panel:#0d1b2e;
  --panel2:#10223a;
  --panel3:#132845;
  --line:#1b3552;
  --text:#f6f8fc;
  --muted:#8ea3bb;
  --blue:#2f8cff;
  --blue2:#1c6eea;
  --cyan:#25c7ff;
  --green:#28d39d;
  --orange:#ffb34d;
  --red:#ff6375;
  --purple:#8d7cff;
  --shadow:0 20px 55px rgba(0,0,0,.32);
}
:root.light{
  --bg:#f4f7fb;--bg2:#eef3f8;--sidebar:#ffffff;
  --panel:#ffffff;--panel2:#f5f8fb;--panel3:#eef4fa;
  --line:#dbe4ef;--text:#172236;--muted:#687b91;
  --shadow:0 18px 42px rgba(28,55,87,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 92% 0%,rgba(28,111,234,.17),transparent 28%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--text);
  font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,textarea,select{font:inherit}
button{
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:11px;
  padding:10px 14px;
  font-weight:750;
  cursor:pointer;
  transition:.18s ease;
}
button:hover{transform:translateY(-1px);border-color:#355777}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.primary{
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  border-color:transparent;
  color:#fff;
  box-shadow:0 10px 26px rgba(47,140,255,.22);
}
.app{
  display:grid;
  grid-template-columns:245px minmax(0,1fr);
  min-height:100vh;
}
.side{
  position:sticky;top:0;height:100vh;
  background:linear-gradient(180deg,rgba(8,20,35,.98),rgba(7,17,31,.98));
  border-right:1px solid var(--line);
  padding:22px 16px;
  backdrop-filter:blur(16px);
}
.brand{
  display:flex;align-items:center;gap:11px;
  padding:2px 10px 24px;
  font-size:20px;font-weight:900;letter-spacing:-.02em;
}
.mark{
  width:36px;height:36px;border-radius:12px;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,var(--blue),var(--cyan));
  box-shadow:0 8px 24px rgba(47,140,255,.28);
}
.side .miniLabel{
  font-size:11px;color:#58708b;font-weight:800;letter-spacing:.12em;
  padding:10px 11px 7px;
}
.nav{display:grid;gap:6px}
.nav button{
  display:flex;align-items:center;gap:11px;
  background:transparent;border:0;text-align:left;color:var(--muted);
  padding:11px 12px;border-radius:11px;font-weight:700;
}
.nav button::before{
  content:"";
  width:7px;height:7px;border-radius:3px;background:#314a63;
}
.nav button.active,.nav button:hover{
  background:linear-gradient(90deg,rgba(47,140,255,.15),rgba(47,140,255,.03));
  color:var(--text);
}
.nav button.active::before{background:var(--blue);box-shadow:0 0 0 4px rgba(47,140,255,.11)}
.main{
  width:100%;max-width:1550px;margin:auto;
  padding:22px 30px 95px;
}
.top{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;margin-bottom:22px;
}
.top h1{margin:2px 0 0;font-size:26px;letter-spacing:-.03em}
.mut{color:var(--muted)}
.row{display:flex;align-items:center;gap:9px}
.between{justify-content:space-between}
.actions{display:flex;align-items:center;gap:8px}
.topSearch{
  width:min(460px,40vw);
  border:1px solid var(--line);
  background:rgba(13,27,46,.78);
  border-radius:12px;padding:11px 14px;
  color:var(--text);outline:none;
}
.card{
  background:
    linear-gradient(165deg,rgba(18,39,65,.95),rgba(10,25,43,.98));
  border:1px solid rgba(45,77,110,.74);
  border-radius:17px;
  padding:17px;
  margin-bottom:13px;
  box-shadow:var(--shadow);
}
:root.light .card{background:linear-gradient(165deg,#fff,#f8fbfe)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:1.18fr .82fr;gap:14px}
.stat{
  position:relative;overflow:hidden;min-height:122px;
}
.stat::after{
  content:"";position:absolute;right:-28px;top:-28px;width:96px;height:96px;
  border-radius:50%;background:radial-gradient(circle,rgba(47,140,255,.18),transparent 68%);
}
.statTop{display:flex;align-items:center;justify-content:space-between}
.statIcon{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  font-size:17px;font-weight:900;
}
.iBlue{background:rgba(47,140,255,.15);color:#75b8ff}
.iOrange{background:rgba(255,179,77,.13);color:var(--orange)}
.iGreen{background:rgba(40,211,157,.13);color:var(--green)}
.iPurple{background:rgba(141,124,255,.14);color:#ad9fff}
.stat span{color:var(--muted);font-weight:700}
.stat b{display:block;font-size:31px;letter-spacing:-.04em;margin-top:10px}
.stat small{color:var(--muted)}
.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.sectionHead h3{margin:0;font-size:15px}
.list{display:grid;gap:9px}
.item{
  background:linear-gradient(180deg,rgba(17,36,58,.86),rgba(14,31,51,.88));
  border:1px solid var(--line);
  border-radius:12px;padding:12px;
}
:root.light .item{background:var(--panel2)}
.click{cursor:pointer}
.click:hover{border-color:#3576b7}
.pill{
  font-size:11px;font-weight:850;padding:5px 8px;border-radius:999px;
  background:rgba(255,255,255,.045);color:var(--muted);border:1px solid rgba(255,255,255,.05)
}
.pill.green{color:var(--green);background:rgba(40,211,157,.08)}
.pill.blue{color:#73b9ff;background:rgba(47,140,255,.09)}
.pill.orange{color:var(--orange);background:rgba(255,179,77,.08)}
.pill.red{color:var(--red);background:rgba(255,99,117,.08)}
.quickActions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quickAction{
  min-height:88px;text-align:left;padding:15px;
  background:linear-gradient(135deg,rgba(47,140,255,.16),rgba(23,54,91,.55));
  border:1px solid rgba(69,118,170,.4);
}
.quickAction strong{display:block;font-size:15px;margin-bottom:5px}
.quickAction span{display:block;color:var(--muted);font-weight:500;font-size:12px}
.deadline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--orange)}
.activityBar{
  display:flex;align-items:flex-end;gap:8px;height:105px;padding-top:12px
}
.activityBar i{
  flex:1;border-radius:7px 7px 3px 3px;
  background:linear-gradient(180deg,var(--blue),rgba(47,140,255,.2));
  min-height:12px;
}
input,textarea,select{
  width:100%;padding:11px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel2);
  color:var(--text);margin:5px 0 11px;outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,140,255,.08)}
textarea{min-height:100px;resize:vertical}.long{min-height:300px}
label{font-size:12px;color:var(--muted);font-weight:800}
.empty{text-align:center;padding:30px;color:var(--muted)}
.tabs{display:flex;gap:7px;overflow:auto;margin:15px 0}
.tabs button{white-space:nowrap;background:rgba(12,27,46,.7)}
.tabs button.on{background:linear-gradient(135deg,var(--blue),var(--blue2));border-color:transparent;color:white}
.problem{border-left:4px solid var(--orange)}
.problem.resolved{border-left-color:var(--green)}
.section{font-size:12px;letter-spacing:.1em;color:#72b6ff;font-weight:900;margin:24px 0 8px}
.qcard{
  border:1px solid var(--line);border-radius:15px;padding:16px;margin:10px 0;
  background:linear-gradient(165deg,rgba(16,34,56,.94),rgba(10,24,41,.95))
}
:root.light .qcard{background:#fff}
.qcard h3{font-size:15px;line-height:1.45;margin:0 0 8px}
.checks{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.check{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 10px}
.check input{width:auto;margin:0}
.progress{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.sticky{
  position:sticky;bottom:8px;z-index:5;background:rgba(9,23,39,.94);
  border:1px solid var(--line);border-radius:14px;padding:10px;
  display:flex;justify-content:flex-end;gap:8px;backdrop-filter:blur(14px)
}
dialog{
  width:min(650px,94vw);max-height:90vh;overflow:auto;
  border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(165deg,var(--panel),var(--bg2));
  color:var(--text);padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.5)
}
dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(4px)}
@media(max-width:560px){
  .grid4{grid-template-columns:1fr 1fr}.quickActions{grid-template-columns:1fr}
  .top h1{font-size:22px}.long{min-height:360px}
  .stat{min-height:112px}.stat b{font-size:28px}
}
</style>

<style id="v7-polish">
.mobileBrand{display:none}
.dashboardHero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.dashboardHero h2{margin:0;font-size:20px;letter-spacing:-.02em}
.dashboardHero p{margin:4px 0 0;color:var(--muted)}
.dashStat{cursor:pointer;transition:.2s ease;min-height:126px}
.dashStat:hover{transform:translateY(-2px);border-color:#3a668f}
.dashStat .statIcon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.metricDelta{font-size:11px;color:var(--muted);margin-top:4px}
.analytics3{display:grid;grid-template-columns:.85fr 1.25fr 1fr;gap:14px;margin-top:14px}
.donutWrap{display:flex;align-items:center;gap:20px;min-height:180px}
.donut{
  --done:25%;
  width:128px;height:128px;border-radius:50%;
  background:conic-gradient(var(--blue) 0 var(--done), var(--green) var(--done) 62%, var(--orange) 62% 82%, #31445b 82% 100%);
  position:relative;flex:0 0 auto;
}
.donut:after{content:"";position:absolute;inset:19px;border-radius:50%;background:var(--panel)}
.donutCenter{position:absolute;inset:0;z-index:2;display:grid;place-items:center;text-align:center;font-weight:900}
.donutCenter small{display:block;color:var(--muted);font-size:10px;font-weight:700}
.legend{display:grid;gap:9px}.legendRow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.legendDot{width:8px;height:8px;border-radius:50%}
.weekChart{height:150px;display:flex;align-items:flex-end;gap:10px;padding:12px 2px 0}
.weekCol{flex:1;display:grid;align-items:end;height:100%;gap:7px;text-align:center;color:var(--muted);font-size:10px}
.weekCol i{display:block;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--blue),rgba(47,140,255,.14));min-height:12px}
.deadlineList{display:grid;gap:8px}.deadlineItem{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);background:var(--panel2);border-radius:11px}.deadlineDate{width:42px;height:42px;border-radius:10px;background:rgba(47,140,255,.1);display:grid;place-items:center;color:#79baff;font-weight:900;font-size:12px}
.ctaGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.ctaCard{cursor:pointer;position:relative;overflow:hidden;min-height:128px;padding:20px;background:linear-gradient(135deg,rgba(47,140,255,.16),rgba(15,35,59,.95))}
.ctaCard.secondary{background:linear-gradient(135deg,rgba(40,211,157,.12),rgba(15,35,59,.95))}
.ctaCard:hover{border-color:#3e6e9b;transform:translateY(-1px)}
.ctaIcon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:rgba(47,140,255,.14);color:#7abbff;margin-bottom:14px}
.secondary .ctaIcon{background:rgba(40,211,157,.11);color:var(--green)}
.ctaIcon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ctaCard h3{margin:0 0 5px;font-size:17px}.ctaCard p{margin:0;color:var(--muted);max-width:520px}
.problemAll{cursor:pointer}
@media(max-width:1100px){.analytics3{grid-template-columns:1fr 1fr}.analytics3>.card:last-child{grid-column:1/-1}}
@media(max-width:900px){
  .main{padding:12px 13px 34px}
  .mobileBrand{display:flex;align-items:center;gap:9px;margin:2px 0 13px;width:max-content}
  .mobileBrand .mark{width:32px;height:32px;border-radius:10px;font-size:12px}
  .top{align-items:flex-start}
  .topSearch{display:none}
  .grid4{grid-template-columns:1fr 1fr}
  .analytics3,.ctaGrid,.grid2{grid-template-columns:1fr}
  .analytics3>.card:last-child{grid-column:auto}
  .dashboardHero{align-items:flex-start}
  .donutWrap{justify-content:center}
}
@media(max-width:560px){
  .top .actions .primary{padding:9px 11px;font-size:12px}
  .dashboardHero h2{font-size:18px}
  .card{border-radius:15px}
  .dashStat{min-height:116px;padding:14px}
  .statIcon{width:35px;height:35px}
  .dashStat b{font-size:28px}
}
</style>


<style id="v8-mobile-fix">
/* Correzione responsive reale: su smartphone la sidebar non deve occupare spazio */
@media (max-width:900px){
  html,body{width:100%;max-width:100%;overflow-x:hidden}
  .app{
    display:block !important;
    width:100% !important;
    min-width:0 !important;
  }
  .side{
    display:none !important;
    width:0 !important;
  }
  .main{
    width:100% !important;
    max-width:none !important;
    min-width:0 !important;
    margin:0 !important;
    padding:12px 14px 32px !important;
  }

  .mobileBrand{
    display:flex !important;
    align-items:center;
    gap:9px;
    margin:2px 0 12px;
    width:max-content;
  }

  .top{
    display:grid !important;
    grid-template-columns:minmax(0,1fr) auto;
    align-items:start !important;
    gap:10px;
    width:100%;
  }
  .top>div:first-child{min-width:0}
  .top h1{
    font-size:22px !important;
    white-space:normal;
    overflow-wrap:anywhere;
  }
  .top .actions{
    flex-shrink:0;
    justify-self:end;
  }
  .topSearch{display:none !important}
  .top .actions .primary{
    white-space:nowrap;
    max-width:150px;
  }

  .dashboardHero{
    width:100%;
    margin:4px 0 14px;
  }
  .dashboardHero h2{font-size:20px}
  .dashboardHero p{
    max-width:34rem;
    line-height:1.45;
  }

  .grid4{
    width:100%;
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
    gap:10px !important;
  }
  .dashStat{
    min-width:0 !important;
    width:100%;
    min-height:124px !important;
    padding:14px !important;
    overflow:hidden;
  }
  .dashStat .statTop{
    align-items:flex-start;
    gap:7px;
  }
  .dashStat .statTop>span{
    min-width:0;
    font-size:13px;
    line-height:1.25;
    overflow-wrap:normal;
    word-break:normal;
  }
  .dashStat .statIcon{
    width:34px !important;
    height:34px !important;
    flex:0 0 34px;
  }
  .dashStat .statIcon svg{
    width:18px !important;
    height:18px !important;
  }
  .dashStat b{
    font-size:30px !important;
    margin-top:10px !important;
  }
  .metricDelta{
    font-size:11px;
    line-height:1.25;
    overflow-wrap:normal;
    word-break:normal;
  }

  .analytics3,.ctaGrid,.grid2{
    width:100%;
    grid-template-columns:1fr !important;
  }
  .analytics3>.card:last-child{grid-column:auto !important}
  .card{min-width:0}
  .donutWrap{
    justify-content:center;
    flex-wrap:wrap;
  }
  .weekChart{min-width:0}
}

@media (max-width:430px){
  .main{padding:10px 11px 28px !important}
  .top .actions button:first-child{display:none}
  .top .actions .primary{
    max-width:none;
    padding:9px 10px !important;
    font-size:11px !important;
  }
  .dashboardHero h2{font-size:19px !important}
  .dashboardHero p{font-size:13px}
  .grid4{gap:8px !important}
  .dashStat{
    min-height:112px !important;
    padding:12px !important;
    border-radius:14px !important;
  }
  .dashStat .statTop>span{font-size:12px}
  .dashStat .statIcon{
    width:30px !important;
    height:30px !important;
    flex-basis:30px;
  }
  .dashStat b{font-size:27px !important;margin-top:8px !important}
  .metricDelta{
    font-size:10px;
    max-width:100%;
  }
}

@media (max-width:350px){
  .grid4{grid-template-columns:1fr !important}
  .dashStat{min-height:105px !important}
}
</style>


<style id="v9-icon-fix">
/* Le icone della dashboard sono vere aree cliccabili, senza cambiare la grafica approvata */
.dashboardIconBtn{
  width:100%;
  height:100%;
  padding:0;
  border:0;
  background:transparent;
  color:inherit;
  display:grid;
  place-items:center;
  border-radius:inherit;
  cursor:pointer;
}
.dashboardIconBtn:hover{transform:none;border:0}
.statIcon{padding:0 !important;overflow:hidden}
.statIcon svg,.ctaIcon svg{pointer-events:none}
.ctaIcon{padding:0 !important;overflow:hidden}
.ctaIcon .dashboardIconBtn{border-radius:13px}
.donutHit{cursor:pointer}
.questionnaireHit{cursor:pointer}
.dashboardClickable{cursor:pointer}
@media(max-width:900px){
  .statIcon,.ctaIcon{touch-action:manipulation}
  .dashboardIconBtn{min-width:100%;min-height:100%}
}
</style>


<style id="v12-product">
.offlineBanner{
  display:none;margin:0 0 14px;padding:10px 13px;border:1px solid rgba(255,179,77,.32);
  background:rgba(255,179,77,.08);border-radius:12px;color:var(--orange);font-size:12px;font-weight:750
}
.offlineBanner.show{display:flex;align-items:center;justify-content:space-between;gap:10px}
.accountBtn{display:inline-flex;align-items:center;gap:8px}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--cyan));color:white;font-size:11px;font-weight:900}
.installBtn{display:none}
.installBtn.show{display:inline-flex}
.authShell{
  min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(circle at 80% 0%,rgba(47,140,255,.18),transparent 30%),linear-gradient(180deg,#06101d,#091625)
}
.authCard{
  width:min(460px,100%);padding:26px;border-radius:22px;border:1px solid var(--line);
  background:linear-gradient(165deg,rgba(15,34,57,.98),rgba(8,22,38,.99));box-shadow:0 30px 80px rgba(0,0,0,.45)
}
.authBrand{display:flex;align-items:center;gap:11px;margin-bottom:20px;font-size:22px;font-weight:900}
.authCard h1{margin:0 0 6px;font-size:26px}.authCard p{color:var(--muted);line-height:1.5}
.authTabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:18px 0}
.authTabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.authMsg{min-height:20px;color:var(--orange);font-size:12px;margin:3px 0 8px}
.settingsGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.settingBox{border:1px solid var(--line);background:var(--panel2);padding:14px;border-radius:12px}
.settingBox h3{margin:0 0 5px;font-size:14px}.settingBox p{margin:0 0 11px;color:var(--muted);font-size:12px;line-height:1.45}
.cloudOk{color:var(--green)}.cloudLocal{color:var(--orange)}
.syncDot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.syncDot.saving{background:var(--orange)}.syncDot.ok{background:var(--green)}.syncDot.error{background:var(--red)}

const STORE='clientpro_v3';
let db=JSON.parse(localStorage.getItem(STORE)||'null')||{theme:'dark',clients:[],tasks:[],history:[]};
let authUser=null;
let workspaceId=null;
let cloudSaveTimer=null;
let cloudSaveRunning=false;
let suppressCloudSave=false;
let deferredInstallPrompt=null;
let activeView='section';
let lastSyncAt=null;
let localDirty=false;
const APP_VERSION='12.5.1';

function syncTimeText(){
  return lastSyncAt ? 'Ultima sincronizzazione: '+lastSyncAt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}) : 'Sincronizzazione non ancora completata';
}
function setSyncState(state){
  const b=document.getElementById('offlineBanner');
  if(!b)return;
  if(!backendReady()){
    b.className='offlineBanner show';
    b.innerHTML='<span>● Modalità locale: i dati sono salvati solo su questo dispositivo.</span><button onclick="openAccountSettings()">Configura cloud</button>';
    return;
  }
  if(!authUser){
    b.className='offlineBanner show';
    b.innerHTML='<span><i class="syncDot error"></i> Sessione non attiva</span><button onclick="location.reload()">Accedi di nuovo</button>';
    return;
  }
  const labels={saving:'Sincronizzazione…',ok:'Dati sincronizzati',error:'Errore di sincronizzazione'};
  b.className='offlineBanner show';
  const retry=state==='error'?'<button onclick="syncNow(true)">Riprova</button>':'<button onclick="syncNow(true)">Sincronizza ora</button>';
  b.innerHTML=`<div class="syncActions"><span><i class="syncDot ${state}"></i> ${labels[state]||'Cloud attivo'} · ${authUser.email||''}</span><span class="syncTime">${syncTimeText()}</span>${retry}</div><span class="betaBadge">v${APP_VERSION}</span>`;
}
async function recoverCloudSession(){
  if(!backendReady())return false;
  try{
    const {data,error}=await SB.auth.getSession();
    if(error)throw error;
    if(data?.session){authUser=data.session.user;return true}
    const refreshed=await SB.auth.refreshSession();
    if(refreshed.error||!refreshed.data?.session)throw (refreshed.error||new Error('Sessione scaduta'));
    authUser=refreshed.data.session.user;
    return true;
  }catch(e){
    console.error('Sessione cloud non valida',e);
    authUser=null;
    setSyncState('error');
    return false;
  }
}
function updateAccountUI(){
  const label=document.getElementById('accountLabel');
  const avatar=document.getElementById('accountAvatar');
  if(label)label.textContent=authUser?.email?authUser.email.split('@')[0]:'Account';
  if(avatar){
    const s=(authUser?.email||'Client Pro').split('@')[0].replace(/[^a-zA-Z0-9 ]/g,' ');
    avatar.textContent=(s.split(' ').filter(Boolean).map(x=>x[0]).join('').slice(0,2)||'CP').toUpperCase();
  }
}
function serializeState(){
  return JSON.parse(JSON.stringify(db));
}
async function ensureWorkspace(){
  if(!backendReady()||!authUser)return null;
  const {data,error}=await SB.rpc('cp_bootstrap_workspace',{p_name:'Il mio spazio ClientPro'});
  if(error){console.error(error);setSyncState('error');return null}
  workspaceId=Array.isArray(data)?data[0]?.workspace_id:data?.workspace_id||data;
  return workspaceId;
}
async function loadCloudState(force=false){
  if(!backendReady()||!authUser)return false;
  if((localDirty||cloudSaveRunning)&&!force)return false;
  if(!workspaceId)await ensureWorkspace();
  if(!workspaceId)return false;
  setSyncState('saving');
  const {data,error}=await SB.rpc('cp_load_workspace_state',{p_workspace_id:workspaceId});
  if(error){
    console.error(error);
    if(String(error.code||'')==='42501'||/401|jwt|token|auth/i.test(error.message||''))await recoverCloudSession();
    setSyncState('error');return false
  }
  const row=Array.isArray(data)?data[0]:data;
  if(row?.payload&&Object.keys(row.payload).length){
    suppressCloudSave=true;
    const localTheme=db.theme;
    db=row.payload;
    if(!db.theme)db.theme=localTheme||'dark';
    localStorage.setItem(STORE,JSON.stringify(db));
    suppressCloudSave=false;
    localDirty=false;
  }else{
    await saveCloudState(true);
  }
  lastSyncAt=new Date();
  setSyncState('ok');
  return true;
}
function scheduleCloudSave(){
  if(suppressCloudSave||!backendReady()||!authUser||!workspaceId)return;
  clearTimeout(cloudSaveTimer);
  setSyncState('saving');
  cloudSaveTimer=setTimeout(()=>saveCloudState(false),650);
}
async function saveCloudState(force=false){
  if(cloudSaveRunning||!backendReady()||!authUser||!workspaceId)return false;
  cloudSaveRunning=true;
  const payload=serializeState();
  const {error}=await SB.rpc('cp_save_workspace_state',{p_workspace_id:workspaceId,p_payload:payload});
  cloudSaveRunning=false;
  if(error){
    console.error(error);
    if(String(error.code||'')==='42501'||/401|jwt|token|auth/i.test(error.message||''))await recoverCloudSession();
    setSyncState('error');return false
  }
  localDirty=false;
  lastSyncAt=new Date();
  setSyncState('ok');
  return true;
}
async function syncNow(manual=false){
  if(!backendReady())return false;
  if(!authUser && !(await recoverCloudSession())){if(manual)alert('La sessione è scaduta. Ricarica ClientPro e accedi di nuovo.');return false}
  if(localDirty){
    const saved=await saveCloudState(true);
    if(!saved)return false;
  }
  const loaded=await loadCloudState(true);
  if(loaded){
    applyTheme();
    if(activeView==='client'&&cur?.id){const id=cur.id, t=tab;cur=db.clients.find(c=>c.id===id)||null;if(cur)openClient(id,t,false);else go('clients',false)}
    else if(activeView==='interview'&&cur?.id){const id=cur.id;cur=db.clients.find(c=>c.id===id)||null;if(cur)renderInterview();else go('clients',false)}
    else if(activeView==='section')renderSection(document.querySelector('[data-page].active')?.dataset.page||'home');
  }
  return loaded;
}



const ONLINE_CFG=window.CLIENTPRO_CONFIG||{};
const SB=(ONLINE_CFG.supabaseUrl&&ONLINE_CFG.supabaseAnonKey&&window.supabase)
  ? window.supabase.createClient(ONLINE_CFG.supabaseUrl,ONLINE_CFG.supabaseAnonKey)
  : null;

function backendReady(){return !!SB}
function ownerSecret(){
  let s=localStorage.getItem('clientpro_owner_secret');
  if(!s){s=crypto.randomUUID()+crypto.randomUUID();localStorage.setItem('clientpro_owner_secret',s)}
  return s;
}
function publicBaseUrl(){
  if(ONLINE_CFG.publicBaseUrl) return ONLINE_CFG.publicBaseUrl.replace(/\/$/,'');
  if(location.protocol==='http:'||location.protocol==='https:') return location.origin+location.pathname;
  return '';
}
function ensureQuestionnaireLocal(c){
  c.questionnaire=c.questionnaire||{status:'Non inviato',answers:{},notes:{}};
  c.questionnaire.answers=c.questionnaire.answers||{};
  c.questionnaire.notes=c.questionnaire.notes||{};
  if(!c.questionnaire.token)c.questionnaire.token=crypto.randomUUID();
  save();
  return c.questionnaire;
}
async function createOnlineQuestionnaire(c){
  const q=ensureQuestionnaireLocal(c);
  if(!backendReady())return {ok:false,reason:'backend'};
  const {error}=await SB.rpc('cp_create_questionnaire_link',{
    p_token:q.token,
    p_owner_secret:ownerSecret(),
    p_client_ref:c.id,
    p_client_name:c.name,
    p_contact_name:c.contact||''
  });
  if(error){console.error(error);return {ok:false,reason:error.message}}
  return {ok:true};
}
async function markQuestionnaireSent(c){
  const q=ensureQuestionnaireLocal(c);
  q.status='Inviato';q.sentAt=new Date().toISOString();save();
  logEvent(c.id,'Questionario inviato');
  if(backendReady()){
    const {error}=await SB.rpc('cp_mark_questionnaire_sent',{p_token:q.token,p_owner_secret:ownerSecret()});
    if(error)console.error(error);
  }
}
async function syncQuestionnaire(clientId,rerender=true){
  const c=db.clients.find(x=>x.id===clientId);
  if(!c?.questionnaire?.token||!backendReady())return false;
  const {data,error}=await SB.rpc('cp_owner_get_questionnaire',{
    p_token:c.questionnaire.token,
    p_owner_secret:ownerSecret()
  });
  if(error){console.error(error);return false}
  const row=Array.isArray(data)?data[0]:data;
  if(!row)return false;
  const before=c.questionnaire.status;
  c.questionnaire.status=row.status||c.questionnaire.status;
  c.questionnaire.sentAt=row.sent_at||c.questionnaire.sentAt;
  c.questionnaire.completedAt=row.completed_at||c.questionnaire.completedAt;
  if(row.answers)c.questionnaire.answers=row.answers;
  if(row.notes)c.questionnaire.notes=row.notes;
  localStorage.setItem(STORE,JSON.stringify(db));
  if(before!==c.questionnaire.status&&c.questionnaire.status==='Compilato')logEvent(c.id,'Questionario compilato dal cliente');
  if(rerender&&activeView==='client'&&cur?.id===c.id&&tab==='analysis')renderClient();
  return true;
}
async function loadPublicQuestionnaire(token){
  if(!backendReady())return null;
  const {data,error}=await SB.rpc('cp_get_public_questionnaire',{p_token:token});
  if(error){console.error(error);return null}
  const row=Array.isArray(data)?data[0]:data;
  if(!row)return null;
  await SB.rpc('cp_mark_questionnaire_opened',{p_token:token});
  return row;
}
async function submitPublicOnline(token,answers,notes){
  if(!backendReady())throw new Error('Servizio online non configurato');
  const {error}=await SB.rpc('cp_submit_public_questionnaire',{
    p_token:token,
    p_answers:answers||{},
    p_notes:notes||{}
  });
  if(error)throw error;
}

let appRoutingEnabled=false;

function pushRoute(route, replace=false){
  if(!appRoutingEnabled) return;
  try{
    if(replace) history.replaceState(route,'');
    else history.pushState(route,'');
  }catch(e){
    console.warn('Router interno non disponibile',e);
  }
}

function renderSection(p){
  activeView='section';
  cur=null;
  activate(p);
  crumb.textContent='ClientPro';
  title.textContent={home:'Dashboard',clients:'Clienti',analysis:'Analisi',problems:'Problemi',projects:'Progetti',tasks:'Attività'}[p]||'Dashboard';
  const fn={home,clients,analysis,problems,projects,tasks}[p]||home;
  fn();
  window.scrollTo(0,0);
}

function restoreRoute(route){
  if(!route){renderSection('home');return}
  if(route.view==='section'){renderSection(route.page||'home');return}
  if(route.view==='client'){openClient(route.clientId,route.tab||'overview',false);return}
  if(route.view==='interview'){
    const c=db.clients.find(x=>x.id===route.clientId);
    if(c){activeView='interview';cur=c;tab='interview';activate('');ensureInterview(cur);renderInterview();window.scrollTo(0,0)}
    else renderSection('clients');
    return;
  }
  if(route.view==='questionnairePreview'){
    const c=db.clients.find(x=>x.id===route.clientId);
    if(c){cur=c;tab='analysis';activate('');renderSelfQuestionnaire(false);window.scrollTo(0,0)}
    else renderSection('clients');
    return;
  }
  renderSection('home');
}

window.addEventListener('popstate',e=>{
  if(!appRoutingEnabled) return;
  restoreRoute(e.state||{view:'section',page:'home'});
});

async function doLogin(){
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  const msg=document.getElementById('authMsg');
  msg.textContent='Accesso…';
  const {data,error}=await SB.auth.signInWithPassword({email,password});
  if(error){msg.textContent=error.message;return}
  authUser=data.user;
  location.reload();
}
async function doSignup(){
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  const p2=document.getElementById('authPassword2').value;
  const msg=document.getElementById('authMsg');
  if(password.length<8){msg.textContent='Usa una password di almeno 8 caratteri.';return}
  if(password!==p2){msg.textContent='Le password non coincidono.';return}
  msg.textContent='Creazione account…';
  const {data,error}=await SB.auth.signUp({email,password,options:{emailRedirectTo:'https://clientprov121supabasecollegato.vercel.app'}});
  if(error){msg.textContent=error.message;return}
  if(data.session){authUser=data.user;location.reload()}
  else msg.textContent='Account creato. Controlla la tua e-mail per confermare la registrazione.';
}
async function resetPassword(){
  const email=document.getElementById('authEmail').value.trim();
  const msg=document.getElementById('authMsg');
  if(!email){msg.textContent='Inserisci prima la tua e-mail.';return}
  const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:'https://clientprov121supabasecollegato.vercel.app?recovery=1'});
  msg.textContent=error?error.message:'Ti ho inviato le istruzioni per reimpostare la password.';
}
async function doLogout(){
  if(!backendReady())return;
  await saveCloudState(true);
  await SB.auth.signOut();
  authUser=null;workspaceId=null;
  localStorage.removeItem(STORE);
  location.reload();
}

function exportData(){
  const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),version:'12.5.1',data:db},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ClientPro_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);
}
async function importData(file){
  if(!file)return;
  try{
    const obj=JSON.parse(await file.text());
    const incoming=obj.data||obj;
    if(!incoming||!Array.isArray(incoming.clients))throw new Error('File non valido');
    if(!confirm('Sostituire i dati attuali con questo backup?'))return;
    db=incoming;save();modal.close();applyTheme();go('home',false);alert('Backup importato correttamente.');
  }catch(e){alert('Il file selezionato non è un backup ClientPro valido.')}
}

<div class=grid2><div class=card><h3>Prossima azione</h3><b>${esc(c.next||'Nessuna')}</b></div><div class=card><h3>Note</h3><div class=mut>${esc(c.notes||'Nessuna nota')}</div></div></div>
<div class=card><h3>Storico recente</h3>${hs.length?hs.map(h=>`<div class=item><b>${esc(h.text)}</b><div class=mut>${fmt(h.date)}</div></div>`).join(''):'<div class=mut>Nessun evento.</div>'}</div>`;

// V12.5.1: sincronizza il questionario senza ridisegnare continuamente la scheda.
if(tab==='analysis')setTimeout(()=>syncQuestionnaire(c.id,false),120);

if(tab==='tasks')ct.innerHTML=`<div class="row between"><h3>Attività cliente</h3><button class=primary onclick="newTask('${c.id}')">＋ Attività</button></div>${taskList(db.tasks.filter(t=>t.clientId===c.id))}`}
function interviewProgress(c){if(!c.interview)return 0;let a=c.interview.answers||{},filled=0;for(let i=1;i<=33;i++){let v=a[i];if(Array.isArray(v)?v.filter(Boolean).length:String(v||'').trim())filled++}return Math.round(filled/33*100)}
function ensureInterview(c){
  if(!c)return null;
  if(!c.problems)c.problems=[];
  if(!c.projects)c.projects=[];
  if(!c.interview || typeof c.interview!=='object'){
    c.interview={answers:{},notes:{},post:[],completed:false,startedAt:new Date().toISOString()};
    logEvent(c.id,'Intervista iniziata');
  }else{
    if(!c.interview.answers || typeof c.interview.answers!=='object')c.interview.answers={};
    if(!c.interview.notes || typeof c.interview.notes!=='object')c.interview.notes={};
    if(!Array.isArray(c.interview.post))c.interview.post=[];
    if(typeof c.interview.completed!=='boolean')c.interview.completed=false;
    if(!c.interview.startedAt)c.interview.startedAt=new Date().toISOString();
  }
  return c.interview;
}

function startInterviewForClient(clientId,push=true){
  try{
    const c=db.clients.find(x=>x.id===clientId);
    if(!c){alert('Cliente non trovato.');return}
    activeView='interview';
    cur=c;
    tab='interview';
    ensureInterview(cur);
    renderInterview();
    window.scrollTo(0,0);
    save();
    if(push)pushRoute({view:'interview',clientId:cur.id});
  }catch(e){
    console.error('Errore apertura intervista',e);
    alert('Errore apertura intervista: '+(e?.message||'errore sconosciuto'));
  }
}

function startInterview(push=true){
  if(!cur || !cur.id){alert('Apri prima un cliente.');return}
  startInterviewForClient(cur.id,push);
}
function renderInterview(){if(!cur||!cur.id){alert('Cliente non disponibile.');go('clients');return}activeView='interview';tab='interview';ensureInterview(cur);let a=cur.interview.answers,n=cur.interview.notes;crumb.textContent='Clienti / '+cur.name;title.textContent='Intervista digitale';let out=`<div class=card><div class="row between"><div><b>${esc(cur.name)}</b><div class=mut>Salvataggio automatico</div></div><span class="pill blue">${interviewProgress(cur)}%</span></div><div class=progress><i style="width:${interviewProgress(cur)}%"></i></div></div>`;
INTERVIEW.forEach(sec=>{out+=`<div class=section>${esc(sec[0])}</div>`;sec[1].forEach(q=>{out+=renderQuestion(q,a,n,true)})});
out+=`<div class=section>9. NOTE E ANALISI POST-INTERVISTA</div><div class=qcard><p class=mut>Da compilare dopo l'incontro. Prima descrivi ciò che hai osservato; solo dopo valuta una possibile soluzione.</p>${['Problemi osservati','Passaggi ripetuti / attività affidate alla memoria','Informazioni sparse tra strumenti diversi','Problema da affrontare per primo','Come viene gestito oggi','Possibile soluzione da valutare'].map((x,i)=>`<label>${x}</label><textarea oninput="postNote(${i},this.value)">${esc(cur.interview.post[i]||'')}</textarea>`).join('')}</div><div class=sticky><button onclick="openClient(cur.id,'analysis',true)">Salva e continua dopo</button><button class=primary onclick=completeInterview()>Completa intervista</button></div>`;view.innerHTML=out}
function renderQuestion(q,a,n,withProblem){let v=a[q.n];let h=`<div class=qcard><h3>${q.n}. ${esc(q.q)}</h3>${q.hint?`<div class=mut>${esc(q.hint)}</div>`:''}`;
if(q.type==='text'||q.type==='long')h+=`<textarea class="${q.type==='long'?'long':''}" oninput="setAns(${q.n},this.value)" placeholder="Scrivi qui...">${esc(v||'')}</textarea>`;
if(q.type==='single'||q.type==='multi')h+=`<div class=checks>${q.options.map(o=>`<label class=check><input type="${q.type==='single'?'radio':'checkbox'}" name="q${q.n}" ${(q.type==='single'?v===o:(v||[]).includes(o))?'checked':''} onchange="setChoice(${q.n},'${o.replaceAll("'","\\'")}','${q.type}',this.checked)"> ${esc(o)}</label>`).join('')}</div><textarea placeholder="Note / dettagli (facoltativo)" oninput="setNote(${q.n},this.value)">${esc(n[q.n]||'')}</textarea>`;
if(q.type==='triple'){let t=v||['','',''];h+=`<input placeholder="1° problema" value="${esc(t[0])}" oninput="setTriple(${q.n},0,this.value)"><input placeholder="2° problema" value="${esc(t[1])}" oninput="setTriple(${q.n},1,this.value)"><input placeholder="3° problema" value="${esc(t[2])}" oninput="setTriple(${q.n},2,this.value)">`}
if(withProblem && [5,6,7,8,9,10,13,15,17,18,20,23,24,25,27,29,31,32,33].includes(q.n))h+=`<button onclick="problemFromAnswer(${q.n},'${q.q.replaceAll("'","\\'")}')">＋ Crea problema da questa risposta</button>`;
return h+'</div>'}
function setAns(n,v){cur.interview.answers[n]=v;save()} function setNote(n,v){cur.interview.notes[n]=v;save()}
function setChoice(n,o,t,ch){if(t==='single')cur.interview.answers[n]=o;else{let a=cur.interview.answers[n]||[];if(ch&&!a.includes(o))a.push(o);if(!ch)a=a.filter(x=>x!==o);cur.interview.answers[n]=a}save()}
function setTriple(n,i,v){let a=cur.interview.answers[n]||['','',''];a[i]=v;cur.interview.answers[n]=a;save()} function postNote(i,v){cur.interview.post[i]=v;save()}
function answerText(n){let v=cur.interview.answers[n],s=Array.isArray(v)?v.filter(Boolean).join(', '):String(v||'');let note=cur.interview.notes[n];return s+(note?' — '+note:'')}
function problemFromAnswer(n,q){let txt=answerText(n);if(!txt.trim())return alert('Prima inserisci una risposta.');cur.problems.push({title:q,description:txt,priority:'Media',solution:'',status:'Da analizzare',source:'Intervista · domanda '+n});logEvent(cur.id,'Creato problema dalla domanda '+n);save();alert('Problema aggiunto alla scheda cliente.')}
function completeInterview(){cur.interview.completed=true;cur.interview.completedAt=new Date().toISOString();logEvent(cur.id,'Intervista completata');save();openClient(cur.id,'analysis',true)}

function questionnaireStatusText(c){
  const q=c.questionnaire;
  if(!q)return 'Non ancora inviato.';
  if(q.status==='Compilato')return 'Risposte ricevute'+(q.completedAt?' · '+fmt(q.completedAt):'')+'.';
  if(q.status==='In compilazione')return 'Il cliente ha aperto il questionario e lo sta compilando.';
  if(q.status==='Inviato')return 'Inviato'+(q.sentAt?' · '+fmt(q.sentAt):'')+'.';
  return 'Pronto per essere inviato al cliente.';
}
function questionnaireAnswerText(n){
  const q=cur?.questionnaire||{};
  const v=q.answers?.[n];
  const base=Array.isArray(v)?v.filter(Boolean).join(', '):String(v||'');
  const note=q.notes?.[n];
  return base+(note?' — '+note:'');
}
function viewQuestionnaireAnswers(){
  if(!cur?.questionnaire)return;
  title.textContent='Risposte questionario';
  crumb.textContent='Clienti / '+cur.name;
  let out=`<div class=card><div class="row between"><div><h2>${esc(cur.name)}</h2><div class=mut>Questionario compilato ${cur.questionnaire.completedAt?'· '+fmt(cur.questionnaire.completedAt):''}</div></div><span class="pill green">Compilato</span></div></div>`;
  SELFQ.forEach(q=>{
    const text=questionnaireAnswerText(q.n);
    if(!text.trim())return;
    out+=`<div class=qcard><h3>${q.n}. ${esc(q.q)}</h3><div class=item>${esc(text)}</div><button onclick="problemFromQuestionnaire(${q.n},'${q.q.replaceAll("'","\\'")}')">＋ Crea problema</button></div>`;
  });
  out+=`<div class=sticky><button onclick="openClient(cur.id,'analysis',true)">Torna all'analisi</button></div>`;
  view.innerHTML=out;
  window.scrollTo(0,0);
}
function problemFromQuestionnaire(n,q){
  const txt=questionnaireAnswerText(n);
  if(!txt.trim())return;
  cur.problems=cur.problems||[];
  cur.problems.push({title:q,description:txt,priority:'Media',solution:'',status:'Da analizzare',source:'Questionario cliente · domanda '+n});
  logEvent(cur.id,'Creato problema dal questionario · domanda '+n);
  save();
  alert('Problema aggiunto alla scheda cliente.');
}

async function prepareQuestionnaire(){
  const q=ensureQuestionnaireLocal(cur);
  const online=await createOnlineQuestionnaire(cur);
  const base=publicBaseUrl();
  const link=(online.ok&&base)?base+'?questionario='+encodeURIComponent(q.token):'';
  const msg=`Ciao ${cur.contact||''}, ti invio un breve questionario per capire meglio come viene gestita la tua attività e quali aspetti potrebbero essere migliorati. Puoi compilarlo direttamente da questo link: ${link||'[link disponibile dopo la configurazione online]'}`;
  show(`<h2>Invia questionario</h2>
    <label>Messaggio</label><textarea id=shareMsg>${esc(msg)}</textarea>
    <label>Link personale</label><input id=shareLink value="${esc(link||'Configurazione online necessaria')}" readonly>
    <div class=row>
      <button class=primary ${link?'':'disabled'} onclick=shareQuestionnaire()>Condividi</button>
      <button ${link?'':'disabled'} onclick=copyQuestionnaire()>Copia link</button>
    </div>
    ${link?'<p class=mut>Il link è personale per questo cliente. Quando lo apre, lo stato passerà automaticamente a “In compilazione”; all’invio delle risposte passerà a “Compilato”.</p>':'<p class=mut>La parte grafica è pronta. Per generare un link realmente utilizzabile da un altro telefono bisogna collegare una volta il backend gratuito incluso nel pacchetto V11.</p>'}`);
}
async function shareQuestionnaire(){
  const text=shareMsg.value,link=shareLink.value;
  if(!link.startsWith('http'))return;
  await markQuestionnaireSent(cur);
  modal.close();
  if(navigator.share){
    try{await navigator.share({title:'Questionario ClientPro',text,url:link})}catch(e){}
  }else{
    await navigator.clipboard.writeText(text);
    alert('Messaggio e link copiati.');
  }
  if(activeView==='client'&&cur&&tab==='analysis')renderClient();
}
async function copyQuestionnaire(){
  const link=shareLink.value;
  if(!link.startsWith('http'))return;
  await navigator.clipboard.writeText(link);
  await markQuestionnaireSent(cur);
  alert('Link copiato.');
  if(activeView==='client'&&cur&&tab==='analysis')renderClient();
}

function renderSelfQuestionnaire(publicMode=false){let qa=cur?.questionnaire?.answers||{},qn=cur?.questionnaire?.notes||{};title.textContent='Questionario cliente';crumb.textContent=publicMode?'ClientPro / Questionario':'Clienti / '+cur.name;let out=`<div class=card><h2>Questionario – Organizzazione dell'attività</h2><p class=mut>Rispondi pensando a come lavorate realmente oggi. Non esistono risposte giuste o sbagliate.</p></div>`;SELFQ.forEach(q=>out+=renderSelfQuestion(q,qa,qn,publicMode));out+=`<div class=sticky><button onclick="${publicMode?'submitPublicQuestionnaire()':"openClient(cur.id,'analysis',true)"}">${publicMode?'Invia risposte':'Torna alla scheda cliente'}</button></div>`;view.innerHTML=out}
function renderSelfQuestion(q,a,n,publicMode){let v=a[q.n],h=`<div class=qcard><h3>${q.n}. ${esc(q.q)}</h3>`;let pref=publicMode?'pub':'self';
if(q.type==='text'||q.type==='long')h+=`<textarea class="${q.type==='long'?'long':''}" oninput="${pref}Ans(${q.n},this.value)">${esc(v||'')}</textarea>`;
if(q.type==='single'||q.type==='multi')h+=`<div class=checks>${q.options.map(o=>`<label class=check><input type="${q.type==='single'?'radio':'checkbox'}" name="${pref}${q.n}" ${(q.type==='single'?v===o:(v||[]).includes(o))?'checked':''} onchange="${pref}Choice(${q.n},'${o.replaceAll("'","\\'")}','${q.type}',this.checked)"> ${esc(o)}</label>`).join('')}</div><textarea placeholder="Dettagli (facoltativo)" oninput="${pref}Note(${q.n},this.value)">${esc(n[q.n]||'')}</textarea>`;
if(q.type==='triple'){let t=v||['','',''];h+=`<input placeholder="1°" value="${esc(t[0])}" oninput="${pref}Triple(${q.n},0,this.value)"><input placeholder="2°" value="${esc(t[1])}" oninput="${pref}Triple(${q.n},1,this.value)"><input placeholder="3°" value="${esc(t[2])}" oninput="${pref}Triple(${q.n},2,this.value)">`}return h+'</div>'}
function ensureQ(){cur.questionnaire=cur.questionnaire||{status:'Non inviato',answers:{},notes:{}}}
function selfAns(n,v){ensureQ();cur.questionnaire.answers[n]=v;save()}function selfNote(n,v){ensureQ();cur.questionnaire.notes[n]=v;save()}function selfChoice(n,o,t,ch){ensureQ();if(t==='single')cur.questionnaire.answers[n]=o;else{let a=cur.questionnaire.answers[n]||[];if(ch&&!a.includes(o))a.push(o);if(!ch)a=a.filter(x=>x!==o);cur.questionnaire.answers[n]=a}save()}function selfTriple(n,i,v){ensureQ();let a=cur.questionnaire.answers[n]||['','',''];a[i]=v;cur.questionnaire.answers[n]=a;save()}
let publicData={answers:{},notes:{},triple:{}};function pubAns(n,v){publicData.answers[n]=v}function pubNote(n,v){publicData.notes[n]=v}function pubChoice(n,o,t,ch){if(t==='single')publicData.answers[n]=o;else{let a=publicData.answers[n]||[];if(ch&&!a.includes(o))a.push(o);if(!ch)a=a.filter(x=>x!==o);publicData.answers[n]=a}}function pubTriple(n,i,v){let a=publicData.answers[n]||['','',''];a[i]=v;publicData.answers[n]=a}

function editClient(){show(`<h2>Modifica cliente</h2><label>Stato</label><select id=st>${['Nuovo contatto','Analisi','Proposta','Cliente','Progetto attivo','Concluso'].map(x=>`<option ${cur.status===x?'selected':''}>${x}</option>`).join('')}</select><label>Prossima azione</label><input id=nx value="${esc(cur.next||'')}"><label>Note</label><textarea id=nt>${esc(cur.notes||'')}</textarea><div class="row"><button class=primary onclick=saveEdit()>Salva</button><button style="border-color:rgba(255,90,90,.35);color:#ff8f8f" onclick="modal.close();setTimeout(deleteClient,50)">Elimina cliente</button></div>`)}
function saveEdit(){cur.status=st.value;cur.next=nx.value;cur.notes=nt.value;logEvent(cur.id,'Scheda cliente aggiornata');save();modal.close();renderClient()}

async function deleteClient(){
  if(!cur)return;
  const clientId=cur.id;
  const name=cur.name;

  if(!confirm(`Eliminare definitivamente "${name}"?\n\nVerranno rimossi anche attività, storico e questionario collegati.`))return;

  try{
    if(backendReady() && authUser && cur.questionnaire?.token){
      const {error}=await SB.rpc('cp_delete_questionnaire',{p_token:cur.questionnaire.token});
      if(error)console.error(error);
    }
  }catch(e){console.error(e)}

  db.tasks=db.tasks.filter(t=>t.clientId!==clientId);
  db.history=db.history.filter(h=>h.clientId!==clientId);
  db.clients=db.clients.filter(c=>c.id!==clientId);
  save();

  cur=null;
  alert(`Cliente "${name}" eliminato.`);
  go('clients',true);
}

function saveTask(){if(!tt.value.trim())return;db.tasks.push({id:crypto.randomUUID(),title:tt.value,clientId:tc.value,date:td.value,done:false});if(tc.value)logEvent(tc.value,'Creata attività “'+tt.value+'”');save();modal.close();cur?renderClient():go('tasks')}
function toggleTask(id){let t=db.tasks.find(x=>x.id===id);t.done=!t.done;if(t.clientId)logEvent(t.clientId,(t.done?'Completata':'Riaperta')+' attività “'+t.title+'”');save();cur?renderClient():go('tasks')}

const publicId=new URLSearchParams(location.search).get('questionario');
(async()=>{
  if(publicId){
    title.textContent='Questionario cliente';
    crumb.textContent='ClientPro / Questionario';
    view.innerHTML='<div class="card empty">Caricamento questionario…</div>';
    const info=await loadPublicQuestionnaire(publicId);
    if(!info){
      view.innerHTML='<div class="card empty">Questionario non disponibile. Controlla il link ricevuto.</div>';
      return;
    }
    cur={name:info.client_name||'Questionario',contact:info.contact_name||'',questionnaire:{answers:{},notes:{}}};
    renderSelfQuestionnaire(true);
    return;
  }

  if(backendReady()){
    const {data}=await SB.auth.getSession();
    const recoveryRequested=new URLSearchParams(location.search).get('recovery')==='1';
    if(recoveryRequested && data.session){showRecoveryPassword();return}
    if(!data.session){showAuth('login');return}
    authUser=data.session.user;
    await ensureWorkspace();
    await loadCloudState();
  }

  appRoutingEnabled=true;
  try{history.replaceState({view:'section',page:'home'},'')}catch(e){}
  applyTheme();
  updateAccountUI();
  lastSyncAt=backendReady()?new Date():null;
  setSyncState(backendReady()?'ok':'local');
  go('home',false);
})();
if(backendReady()){
  SB.auth.onAuthStateChange((event,session)=>{
    if(session?.user){authUser=session.user;updateAccountUI()}
    if(event==='SIGNED_OUT'){authUser=null;setSyncState('error')}
  });
}
window.addEventListener('focus',()=>{if(backendReady()&&authUser&&!localDirty)syncNow(false)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&backendReady()&&authUser&&!localDirty)syncNow(false)});
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(console.warn);
</script></body></html>
