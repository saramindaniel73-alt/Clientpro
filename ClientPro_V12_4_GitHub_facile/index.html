<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClientPro</title><meta name="theme-color" content="#06101d"><meta name="description" content="ClientPro V13 - Developer Workspace: clienti, problemi, soluzioni e progetti"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --bg:#07111f;
  --bg2:#0a1525;
  --sidebar:#081423;
  --panel:#0d1b2e;
  --panel2:#10223a;
  --panel3:#132845;
  --line:#1b3552;
  --text:#f6f8fc;
  --muted:#8ea3bb;
  --blue:#2f8cff;
  --blue2:#1c6eea;
  --cyan:#25c7ff;
  --green:#28d39d;
  --orange:#ffb34d;
  --red:#ff6375;
  --purple:#8d7cff;
  --shadow:0 20px 55px rgba(0,0,0,.32);
}
:root.light{
  --bg:#f4f7fb;--bg2:#eef3f8;--sidebar:#ffffff;
  --panel:#ffffff;--panel2:#f5f8fb;--panel3:#eef4fa;
  --line:#dbe4ef;--text:#172236;--muted:#687b91;
  --shadow:0 18px 42px rgba(28,55,87,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 92% 0%,rgba(28,111,234,.17),transparent 28%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--text);
  font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,textarea,select{font:inherit}
button{
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:11px;
  padding:10px 14px;
  font-weight:750;
  cursor:pointer;
  transition:.18s ease;
}
button:hover{transform:translateY(-1px);border-color:#355777}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.primary{
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  border-color:transparent;
  color:#fff;
  box-shadow:0 10px 26px rgba(47,140,255,.22);
}
.app{
  display:grid;
  grid-template-columns:245px minmax(0,1fr);
  min-height:100vh;
}
.side{
  position:sticky;top:0;height:100vh;
  background:linear-gradient(180deg,rgba(8,20,35,.98),rgba(7,17,31,.98));
  border-right:1px solid var(--line);
  padding:22px 16px;
  backdrop-filter:blur(16px);
}
.brand{
  display:flex;align-items:center;gap:11px;
  padding:2px 10px 24px;
  font-size:20px;font-weight:900;letter-spacing:-.02em;
}
.mark{
  width:36px;height:36px;border-radius:12px;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,var(--blue),var(--cyan));
  box-shadow:0 8px 24px rgba(47,140,255,.28);
}
.side .miniLabel{
  font-size:11px;color:#58708b;font-weight:800;letter-spacing:.12em;
  padding:10px 11px 7px;
}
.nav{display:grid;gap:6px}
.nav button{
  display:flex;align-items:center;gap:11px;
  background:transparent;border:0;text-align:left;color:var(--muted);
  padding:11px 12px;border-radius:11px;font-weight:700;
}
.nav button::before{
  content:"";
  width:7px;height:7px;border-radius:3px;background:#314a63;
}
.nav button.active,.nav button:hover{
  background:linear-gradient(90deg,rgba(47,140,255,.15),rgba(47,140,255,.03));
  color:var(--text);
}
.nav button.active::before{background:var(--blue);box-shadow:0 0 0 4px rgba(47,140,255,.11)}
.main{
  width:100%;max-width:1550px;margin:auto;
  padding:22px 30px 95px;
}
.top{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;margin-bottom:22px;
}
.top h1{margin:2px 0 0;font-size:26px;letter-spacing:-.03em}
.mut{color:var(--muted)}
.row{display:flex;align-items:center;gap:9px}
.between{justify-content:space-between}
.actions{display:flex;align-items:center;gap:8px}
.topSearch{
  width:min(460px,40vw);
  border:1px solid var(--line);
  background:rgba(13,27,46,.78);
  border-radius:12px;padding:11px 14px;
  color:var(--text);outline:none;
}
.card{
  background:
    linear-gradient(165deg,rgba(18,39,65,.95),rgba(10,25,43,.98));
  border:1px solid rgba(45,77,110,.74);
  border-radius:17px;
  padding:17px;
  margin-bottom:13px;
  box-shadow:var(--shadow);
}
:root.light .card{background:linear-gradient(165deg,#fff,#f8fbfe)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:1.18fr .82fr;gap:14px}
.stat{
  position:relative;overflow:hidden;min-height:122px;
}
.stat::after{
  content:"";position:absolute;right:-28px;top:-28px;width:96px;height:96px;
  border-radius:50%;background:radial-gradient(circle,rgba(47,140,255,.18),transparent 68%);
}
.statTop{display:flex;align-items:center;justify-content:space-between}
.statIcon{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  font-size:17px;font-weight:900;
}
.iBlue{background:rgba(47,140,255,.15);color:#75b8ff}
.iOrange{background:rgba(255,179,77,.13);color:var(--orange)}
.iGreen{background:rgba(40,211,157,.13);color:var(--green)}
.iPurple{background:rgba(141,124,255,.14);color:#ad9fff}
.stat span{color:var(--muted);font-weight:700}
.stat b{display:block;font-size:31px;letter-spacing:-.04em;margin-top:10px}
.stat small{color:var(--muted)}
.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.sectionHead h3{margin:0;font-size:15px}
.list{display:grid;gap:9px}
.item{
  background:linear-gradient(180deg,rgba(17,36,58,.86),rgba(14,31,51,.88));
  border:1px solid var(--line);
  border-radius:12px;padding:12px;
}
:root.light .item{background:var(--panel2)}
.click{cursor:pointer}
.click:hover{border-color:#3576b7}
.pill{
  font-size:11px;font-weight:850;padding:5px 8px;border-radius:999px;
  background:rgba(255,255,255,.045);color:var(--muted);border:1px solid rgba(255,255,255,.05)
}
.pill.green{color:var(--green);background:rgba(40,211,157,.08)}
.pill.blue{color:#73b9ff;background:rgba(47,140,255,.09)}
.pill.orange{color:var(--orange);background:rgba(255,179,77,.08)}
.pill.red{color:var(--red);background:rgba(255,99,117,.08)}
.quickActions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quickAction{
  min-height:88px;text-align:left;padding:15px;
  background:linear-gradient(135deg,rgba(47,140,255,.16),rgba(23,54,91,.55));
  border:1px solid rgba(69,118,170,.4);
}
.quickAction strong{display:block;font-size:15px;margin-bottom:5px}
.quickAction span{display:block;color:var(--muted);font-weight:500;font-size:12px}
.deadline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--orange)}
.activityBar{
  display:flex;align-items:flex-end;gap:8px;height:105px;padding-top:12px
}
.activityBar i{
  flex:1;border-radius:7px 7px 3px 3px;
  background:linear-gradient(180deg,var(--blue),rgba(47,140,255,.2));
  min-height:12px;
}
input,textarea,select{
  width:100%;padding:11px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel2);
  color:var(--text);margin:5px 0 11px;outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,140,255,.08)}
textarea{min-height:100px;resize:vertical}.long{min-height:300px}
label{font-size:12px;color:var(--muted);font-weight:800}
.empty{text-align:center;padding:30px;color:var(--muted)}
.tabs{display:flex;gap:7px;overflow:auto;margin:15px 0}
.tabs button{white-space:nowrap;background:rgba(12,27,46,.7)}
.tabs button.on{background:linear-gradient(135deg,var(--blue),var(--blue2));border-color:transparent;color:white}
.problem{border-left:4px solid var(--orange)}
.problem.resolved{border-left-color:var(--green)}
.section{font-size:12px;letter-spacing:.1em;color:#72b6ff;font-weight:900;margin:24px 0 8px}
.qcard{
  border:1px solid var(--line);border-radius:15px;padding:16px;margin:10px 0;
  background:linear-gradient(165deg,rgba(16,34,56,.94),rgba(10,24,41,.95))
}
:root.light .qcard{background:#fff}
.qcard h3{font-size:15px;line-height:1.45;margin:0 0 8px}
.checks{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.check{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 10px}
.check input{width:auto;margin:0}
.progress{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.sticky{
  position:sticky;bottom:8px;z-index:5;background:rgba(9,23,39,.94);
  border:1px solid var(--line);border-radius:14px;padding:10px;
  display:flex;justify-content:flex-end;gap:8px;backdrop-filter:blur(14px)
}
dialog{
  width:min(650px,94vw);max-height:90vh;overflow:auto;
  border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(165deg,var(--panel),var(--bg2));
  color:var(--text);padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.5)
}
dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(4px)}
@media(max-width:560px){
  .grid4{grid-template-columns:1fr 1fr}.quickActions{grid-template-columns:1fr}
  .top h1{font-size:22px}.long{min-height:360px}
  .stat{min-height:112px}.stat b{font-size:28px}
}
</style>

<style id="v7-polish">
.mobileBrand{display:none}
.dashboardHero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.dashboardHero h2{margin:0;font-size:20px;letter-spacing:-.02em}
.dashboardHero p{margin:4px 0 0;color:var(--muted)}
.dashStat{cursor:pointer;transition:.2s ease;min-height:126px}
.dashStat:hover{transform:translateY(-2px);border-color:#3a668f}
.dashStat .statIcon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.metricDelta{font-size:11px;color:var(--muted);margin-top:4px}
.analytics3{display:grid;grid-template-columns:.85fr 1.25fr 1fr;gap:14px;margin-top:14px}
.donutWrap{display:flex;align-items:center;gap:20px;min-height:180px}
.donut{
  --done:25%;
  width:128px;height:128px;border-radius:50%;
  background:conic-gradient(var(--blue) 0 var(--done), var(--green) var(--done) 62%, var(--orange) 62% 82%, #31445b 82% 100%);
  position:relative;flex:0 0 auto;
}
.donut:after{content:"";position:absolute;inset:19px;border-radius:50%;background:var(--panel)}
.donutCenter{position:absolute;inset:0;z-index:2;display:grid;place-items:center;text-align:center;font-weight:900}
.donutCenter small{display:block;color:var(--muted);font-size:10px;font-weight:700}
.legend{display:grid;gap:9px}.legendRow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.legendDot{width:8px;height:8px;border-radius:50%}
.weekChart{height:150px;display:flex;align-items:flex-end;gap:10px;padding:12px 2px 0}
.weekCol{flex:1;display:grid;align-items:end;height:100%;gap:7px;text-align:center;color:var(--muted);font-size:10px}
.weekCol i{display:block;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--blue),rgba(47,140,255,.14));min-height:12px}
.deadlineList{display:grid;gap:8px}.deadlineItem{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);background:var(--panel2);border-radius:11px}.deadlineDate{width:42px;height:42px;border-radius:10px;background:rgba(47,140,255,.1);display:grid;place-items:center;color:#79baff;font-weight:900;font-size:12px}
.ctaGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.ctaCard{cursor:pointer;position:relative;overflow:hidden;min-height:128px;padding:20px;background:linear-gradient(135deg,rgba(47,140,255,.16),rgba(15,35,59,.95))}
.ctaCard.secondary{background:linear-gradient(135deg,rgba(40,211,157,.12),rgba(15,35,59,.95))}
.ctaCard:hover{border-color:#3e6e9b;transform:translateY(-1px)}
.ctaIcon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:rgba(47,140,255,.14);color:#7abbff;margin-bottom:14px}
.secondary .ctaIcon{background:rgba(40,211,157,.11);color:var(--green)}
.ctaIcon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ctaCard h3{margin:0 0 5px;font-size:17px}.ctaCard p{margin:0;color:var(--muted);max-width:520px}
.problemAll{cursor:pointer}
@media(max-width:1100px){.analytics3{grid-template-columns:1fr 1fr}.analytics3>.card:last-child{grid-column:1/-1}}
@media(max-width:900px){
  .main{padding:12px 13px 34px}
  .mobileBrand{display:flex;align-items:center;gap:9px;margin:2px 0 13px;width:max-content}
  .mobileBrand .mark{width:32px;height:32px;border-radius:10px;font-size:12px}
  .top{align-items:flex-start}
  .topSearch{display:none}
  .grid4{grid-template-columns:1fr 1fr}
  .analytics3,.ctaGrid,.grid2{grid-template-columns:1fr}
  .analytics3>.card:last-child{grid-column:auto}
  .dashboardHero{align-items:flex-start}
  .donutWrap{justify-content:center}
}
@media(max-width:560px){
  .top .actions .primary{padding:9px 11px;font-size:12px}
  .dashboardHero h2{font-size:18px}
  .card{border-radius:15px}
  .dashStat{min-height:116px;padding:14px}
  .statIcon{width:35px;height:35px}
  .dashStat b{font-size:28px}
}
</style>


<style id="v8-mobile-fix">
/* Correzione responsive reale: su smartphone la sidebar non deve occupare spazio */
@media (max-width:900px){
  html,body{width:100%;max-width:100%;overflow-x:hidden}
  .app{
    display:block !important;
    width:100% !important;
    min-width:0 !important;
  }
  .side{
    display:none !important;
    width:0 !important;
  }
  .main{
    width:100% !important;
    max-width:none !important;
    min-width:0 !important;
    margin:0 !important;
    padding:12px 14px 32px !important;
  }

  .mobileBrand{
    display:flex !important;
    align-items:center;
    gap:9px;
    margin:2px 0 12px;
    width:max-content;
  }

  .top{
    display:grid !important;
    grid-template-columns:minmax(0,1fr) auto;
    align-items:start !important;
    gap:10px;
    width:100%;
  }
  .top>div:first-child{min-width:0}
  .top h1{
    font-size:22px !important;
    white-space:normal;
    overflow-wrap:anywhere;
  }
  .top .actions{
    flex-shrink:0;
    justify-self:end;
  }
  .topSearch{display:none !important}
  .top .actions .primary{
    white-space:nowrap;
    max-width:150px;
  }

  .dashboardHero{
    width:100%;
    margin:4px 0 14px;
  }
  .dashboardHero h2{font-size:20px}
  .dashboardHero p{
    max-width:34rem;
    line-height:1.45;
  }

  .grid4{
    width:100%;
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
    gap:10px !important;
  }
  .dashStat{
    min-width:0 !important;
    width:100%;
    min-height:124px !important;
    padding:14px !important;
    overflow:hidden;
  }
  .dashStat .statTop{
    align-items:flex-start;
    gap:7px;
  }
  .dashStat .statTop>span{
    min-width:0;
    font-size:13px;
    line-height:1.25;
    overflow-wrap:normal;
    word-break:normal;
  }
  .dashStat .statIcon{
    width:34px !important;
    height:34px !important;
    flex:0 0 34px;
  }
  .dashStat .statIcon svg{
    width:18px !important;
    height:18px !important;
  }
  .dashStat b{
    font-size:30px !important;
    margin-top:10px !important;
  }
  .metricDelta{
    font-size:11px;
    line-height:1.25;
    overflow-wrap:normal;
    word-break:normal;
  }

  .analytics3,.ctaGrid,.grid2{
    width:100%;
    grid-template-columns:1fr !important;
  }
  .analytics3>.card:last-child{grid-column:auto !important}
  .card{min-width:0}
  .donutWrap{
    justify-content:center;
    flex-wrap:wrap;
  }
  .weekChart{min-width:0}
}

@media (max-width:430px){
  .main{padding:10px 11px 28px !important}
  .top .actions button:first-child{display:none}
  .top .actions .primary{
    max-width:none;
    padding:9px 10px !important;
    font-size:11px !important;
  }
  .dashboardHero h2{font-size:19px !important}
  .dashboardHero p{font-size:13px}
  .grid4{gap:8px !important}
  .dashStat{
    min-height:112px !important;
    padding:12px !important;
    border-radius:14px !important;
  }
  .dashStat .statTop>span{font-size:12px}
  .dashStat .statIcon{
    width:30px !important;
    height:30px !important;
    flex-basis:30px;
  }
  .dashStat b{font-size:27px !important;margin-top:8px !important}
  .metricDelta{
    font-size:10px;
    max-width:100%;
  }
}

@media (max-width:350px){
  .grid4{grid-template-columns:1fr !important}
  .dashStat{min-height:105px !important}
}
</style>


<style id="v9-icon-fix">
/* Le icone della dashboard sono vere aree cliccabili, senza cambiare la grafica approvata */
.dashboardIconBtn{
  width:100%;
  height:100%;
  padding:0;
  border:0;
  background:transparent;
  color:inherit;
  display:grid;
  place-items:center;
  border-radius:inherit;
  cursor:pointer;
}
.dashboardIconBtn:hover{transform:none;border:0}
.statIcon{padding:0 !important;overflow:hidden}
.statIcon svg,.ctaIcon svg{pointer-events:none}
.ctaIcon{padding:0 !important;overflow:hidden}
.ctaIcon .dashboardIconBtn{border-radius:13px}
.donutHit{cursor:pointer}
.questionnaireHit{cursor:pointer}
.dashboardClickable{cursor:pointer}
@media(max-width:900px){
  .statIcon,.ctaIcon{touch-action:manipulation}
  .dashboardIconBtn{min-width:100%;min-height:100%}
}
</style>


<style id="v12-product">
.offlineBanner{
  display:none;margin:0 0 14px;padding:10px 13px;border:1px solid rgba(255,179,77,.32);
  background:rgba(255,179,77,.08);border-radius:12px;color:var(--orange);font-size:12px;font-weight:750
}
.offlineBanner.show{display:flex;align-items:center;justify-content:space-between;gap:10px}
.accountBtn{display:inline-flex;align-items:center;gap:8px}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--cyan));color:white;font-size:11px;font-weight:900}
.installBtn{display:none}
.installBtn.show{display:inline-flex}
.authShell{
  min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(circle at 80% 0%,rgba(47,140,255,.18),transparent 30%),linear-gradient(180deg,#06101d,#091625)
}
.authCard{
  width:min(460px,100%);padding:26px;border-radius:22px;border:1px solid var(--line);
  background:linear-gradient(165deg,rgba(15,34,57,.98),rgba(8,22,38,.99));box-shadow:0 30px 80px rgba(0,0,0,.45)
}
.authBrand{display:flex;align-items:center;gap:11px;margin-bottom:20px;font-size:22px;font-weight:900}
.authCard h1{margin:0 0 6px;font-size:26px}.authCard p{color:var(--muted);line-height:1.5}
.authTabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:18px 0}
.authTabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.authMsg{min-height:20px;color:var(--orange);font-size:12px;margin:3px 0 8px}
.settingsGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.settingBox{border:1px solid var(--line);background:var(--panel2);padding:14px;border-radius:12px}
.settingBox h3{margin:0 0 5px;font-size:14px}.settingBox p{margin:0 0 11px;color:var(--muted);font-size:12px;line-height:1.45}
.cloudOk{color:var(--green)}.cloudLocal{color:var(--orange)}
.syncDot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.syncDot.saving{background:var(--orange)}.syncDot.ok{background:var(--green)}.syncDot.error{background:var(--red)}

Altro"]}, {"n": 14, "q": "Come vengono raccolte e ritrovate le informazioni necessarie sul cliente?", "type": "text"}, {"n": 15, "q": "Ci sono lavori, materiali o attività da preparare prima dell'appuntamento? Come ricordate cosa deve essere pronto?", "type": "text"}]], ["5. MATERIALI, SCORTE E FORNITORI", [{"n": 16, "q": "Come gestite attualmente materiali e scorte?", "type": "multi", "options": ["A memoria", "Controllo visivo", "Carta", "Foglio/Excel", "App/gestionale", "Altro"]}, {"n": 17, "q": "Come vi accorgete che un prodotto o materiale sta finendo?", "type": "text"}, {"n": 18, "q": "Vi è mai capitato di rimanere senza qualcosa di necessario?", "type": "single", "options": ["Mai", "Raramente", "Qualche volta", "Spesso"]}, {"n": 19, "q": "I collaboratori hanno materiali personali o assegnati individualmente?", "type": "single", "options": ["Sì", "No", "In parte", "Non applicabile"]}, {"n": 20, "q": "Come vengono effettuati gli ordini ai fornitori?", "type": "text"}, {"n": 21, "q": "Ci sono prodotti per cui dovete controllare scadenza, lotto, quantità minima o altre informazioni?", "type": "single", "options": ["Sì", "No", "Solo alcuni", "Non applicabile"]}]], ["6. PAGAMENTI, COLLABORATORI E INFORMAZIONI", [{"n": 22, "q": "Gestite caparre, acconti o pagamenti anticipati?", "type": "single", "options": ["Sì", "No", "Solo in alcuni casi"]}, {"n": 23, "q": "Come controllate ciò che è stato pagato e ciò che resta da pagare?", "type": "text"}, {"n": 24, "q": "Come vengono organizzati collaboratori, turni e postazioni di lavoro?", "type": "text"}, {"n": 25, "q": "Quali informazioni devono poter vedere tutti e quali invece solo il titolare o determinate persone?", "type": "text"}, {"n": 26, "q": "Come vi scambiate le informazioni importanti durante la giornata?", "type": "multi", "options": ["A voce", "WhatsApp/chat", "Agenda", "Note", "E-mail", "Gestionale", "Altro"]}]], ["7. STRUMENTI E POSSIBILI MIGLIORAMENTI", [{"n": 27, "q": "Quali strumenti o applicazioni utiliz function setSyncState(state){
  const b=document.getElementById('offlineBanner');
  if(!b)return;
  if(!backendReady()){
    b.className='offlineBanner show';
    b.innerHTML='<span>● Modalità locale: i dati sono salvati solo su questo dispositivo.</span><button onclick="openAccountSettings()">Configura cloud</button>';
    return;
  }

    b.className='offlineBanner show';
    b.innerHTML='<span><i class="syncDot error"></i> Sessione non attiva</span><button onclick="location.reload()">Accedi di nuovo</button>';
    return;
  }

  b.className='offlineBanner show';
  const retry=state==='error'?'<button onclick="syncNow(true)">Riprova</button>':'<button onclick="syncNow(true)">Sincronizza ora</button>';
  b.innerHTML=`<div class="syncActions"><span><i class="syncDot ${state}"></i> ${labels[state]||'Cloud attivo'} · ${authUser.email||''}</span><span class="syncTime">${syncTimeText()}</span>${retry}</div><span class="betaBadge">v${APP_VERSION}</span>`;
}
async function recoverCloudSession(){
  if(!backendReady())return false;
  try{
    const {data,error}=await SB.auth.getSession();
    if(error)throw error;
    if(data?.session){authUser=data.session.user;return true}
    const refreshed=await SB.auth.refreshSession();
    if(refreshed.error||!refreshed.data?.session)throw (refreshed.error||new Error('Sessione scaduta'));
    authUser=refreshed.data.session.user;
    return true;
  }catch(e){
    console.error('Sessione cloud non valida',e);
    authUser=null;
    setSyncState('error');
    return false;
  }
}

}

  workspaceId=Array.isArray(data)?data[0]?.workspace_id:data?.workspace_id||data;
  return workspaceId;
}
async function loadCloudState(force=false){
  if(!backendReady()||!authUser)return false;
  if((localDirty||cloudSaveRunning)&&!force)return false;
  if(!workspaceId)await ensureWorkspace();
  if(!workspaceId)return false;
  setSyncState('saving');
  const {data,error}=await SB.rpc('cp_load_workspace_state',{p_workspace_id:workspaceId});
  if(error){
    console.error(error);
    if(String(error.code||'')==='42501'||/401|jwt|token|auth/i.test(error.message||''))await recoverCloudSession();
    setSyncState('error');return false
  }
  const row=Array.isArray(data)?data[0]:data;
  let pendingTimeMerged=0;
  if(row?.payload&&Object.keys(row.payload).length){
    suppressCloudSave=true;
    const localTheme=db.theme;
    db=row.payload;
    if(!db.theme)db.theme=localTheme||'dark';
    const beforeMigration=JSON.stringify(db);
    ensureAllData();
    const dataMigrated=beforeMigration!==JSON.stringify(db);
    pendingTimeMerged=mergePendingTimeEntries();
    localStorage.setItem(STORE,JSON.stringify(db));
    suppressCloudSave=false;
    localDirty=pendingTimeMerged>0||dataMigrated;
  }else{
    ensureAllData();
    await saveCloudState(true);
  }
  lastSyncAt=new Date();
  setSyncState('ok');
  if(pendingTimeMerged||localDirty)await saveCloudState(true);
  return true;
}
function scheduleCloudSave(){
  if(suppressCloudSave||!backendReady()||!authUser||!workspaceId)return;
  clearTimeout(cloudSaveTimer);
  setSyncState('saving');
  cloudSaveTimer=setTimeout(()=>saveCloudState(false),650);
}
async function saveCloudState(force=false){
  if(cloudSaveRunning||!backendReady()||!authUser||!workspaceId)return false;
  cloudSaveRunning=true;
  const payload=serializeState();
  const {error}=await SB.rpc('cp_save_workspace_state',{p_workspace_id:workspaceId,p_payload:payload});
  cloudSaveRunning=false;
  if(error){
    console.error(error);
    if(String(error.code||'')==='42501'||/401|jwt|token|auth/i.test(error.message||''))await recoverCloudSession();
    setSyncState('error');return false
  }
  localDirty=false;
  clearSyncedPendingTime(payload);
  lastSyncAt=new Date();
  setSyncState('ok');
  return true;
}
async function syncNow(manual=false){
  if(!backendReady())return false;
  if(!authUser && !(await recoverCloudSession())){if(manual)alert('La sessione è scaduta. Ricarica ClientPro e accedi di nuovo.');return false}
  if(localDirty){
    const saved=await saveCloudState(true);
    if(!saved)return false;
  }
  const loaded=await loadCloudState(true);
  if(loaded){
    applyTheme();
    if(activeView==='client'&&cur?.id){const id=cur.id, t=tab;cur=db.clients.find(c=>c.id===id)||null;if(cur)openClient(id,t,false);else go('clients',false)}
    else if(activeView==='interview'&&cur?.id){const id=cur.id;cur=db.clients.find(c=>c.id===id)||null;if(cur)renderInterview();else go('clients',false)}
    else if(activeView==='problemWorkspace'&&v13Problem?.id){await loadProblemWorkspace(v13Problem.id,v13Section,false)}
    else if(activeView==='section')renderSection(document.querySelector('[data-page].active')?.dataset.page||'home');
  }
  return loaded;
}

function ensureClientData(c){
  if(!c)return c;

function pendingTimeEntries(){try{const value=JSON.parse(localStorage.getItem(PENDING_TIME_KEY)||'[]');return Array.isArray(value)?value:[]}catch(e){return []}}
function queuePendingTime(entry){const pending=pendingTimeEntries();if(!pending.some(e=>e.id===entry.id))pending.push(entry);localStorage.setItem(PENDING_TIME_KEY,JSON.stringify(pending))}
function mergePendingTimeEntries(){ensureTimeData();const pending=pendingTimeEntries(),known=new Set(db.timeEntries.map(e=>e.id));let added=0;pending.forEach(entry=>{if(entry?.id&&!known.has(entry.id)){db.timeEntries.push(entry);known.add(entry.id);added++}});return added}
function clearSyncedPendingTime(payload){const synced=new Set((payload?.timeEntries||[]).map(e=>e.id));const remaining=pendingTimeEntries().filter(e=>!synced.has(e.id));if(remaining.length)localStorage.setItem(PENDING_TIME_KEY,JSON.stringify(remaining));else localStorage.removeItem(PENDING_TIME_KEY)}

function closeTimeSession(reason='context',endedAt=Date.now()){
  if(!activeTimeSession)return;
  const s=activeTimeSession;activeTimeSession=null;clearTimeout(idleTimer);idleTimer=null;
  const end=Math.max(s.startedAt,Math.min(endedAt,Date.now())),durationMs=Math.max(0,end-s.startedAt);
  if(durationMs>=1000){
    ensureTimeData();
    const entry={id:s.id,clientId:s.clientId,category:s.category,projectId:s.projectId||'',startedAt:new Date(s.startedAt).toISOString(),endedAt:new Date(end).toISOString(),durationMs,closeReason:reason};
    db.timeEntries.push(entry);queuePendingTime(entry);save();
  }
  persistActiveTime();
}

function resetIdleTimer(){clearTimeout(idleTimer);if(!activeTimeSession)return;const remaining=Math.max(0,activeTimeSession.lastActivityAt+IDLE_LIMIT_MS-Date.now());idleTimer=setTimeout(()=>{if(activeTimeSession)closeTimeSession('inattività',activeTimeSession.lastActivityAt+IDLE_LIMIT_MS)},remaining)}

function timeEntriesFor(clientId){ensureTimeData();return db.timeEntries.filter(e=>e.clientId===clientId)}
function timeMsFor(clientId,category='',projectId=null){
  let total=timeEntriesFor(clientId).filter(e=>(!category||e.category===category)&&(projectId===null||(e.projectId||'')===projectId)).reduce((sum,e)=>sum+Math.max(0,Number(e.durationMs)||0),0);
  if(activeTimeSession?.clientId===clientId&&(!category||activeTimeSession.category===category)&&(projectId===null||(activeTimeSession.projectId||'')===projectId))total+=Math.max(0,Date.now()-activeTimeSession.startedAt);
  return total;
}
function formatDuration(ms){const minutes=Math.floor(Math.max(0,ms)/60000),hours=Math.floor(minutes/60),mins=minutes%60;if(!hours)return `${mins} min`;return `${hours} h${mins?' '+String(mins).padStart(2,'0')+' min':''}`}
function moneyFmt(v){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(v)||0)}
function moneyValue(c){const rate=Number(c.hourlyRate)||0;return rate?moneyFmt(timeMsFor(c.id)/3600000*rate):'—'}
function timeSummaryHTML(c){const total=timeMsFor(c.id);return `<div class="timeSummary"><div class=card><h3>Tempo di lavoro</h3><div class=timeTotal>${formatDuration(total)}</div><div class=mut>Conteggio automatico nelle aree di lavoro del cliente.</div><div class=rateRow><label for=hourlyRate>Tariffa €/ora</label><input id=hourlyRate type=number min=0 step=0.5 inputmode=decimal value="${esc(c.hourlyRate??'')}" onchange="setHourlyRate(this.value)"></div><p>Valore stimato: <span class=timeValue>${moneyValue(c)}</span></p></div><div class=card><h3>Suddivisione per categoria</h3><div class=timeBreakdown>${TIME_CATEGORIES.map(category=>`<div class=item><div class="row between"><span>${category}</span><b>${formatDuration(timeMsFor(c.id,category))}</b></div></div>`).join('')}</div></div></div>`}

function projectById(c,id){return (c?.projects||[]).find(p=>p.id===id)||null}
function projectLabel(p){if(!p)return '';if(p.relationType==='assistance')return 'Assistenza / modifica';if(p.relationType==='resume')return 'Ripreso';return 'Nuovo progetto'}
function projectTimeMs(c,p){
  ensureProjectData(p,c);
  const closures=p.closures||[],last=closures.length?latestClosure(p):null,lastClose=last?Date.parse(last.closedAt||''):0;
  const entries=timeEntriesFor(c.id).filter(e=>!lastClose||Date.parse(e.startedAt||'')>lastClose);
  if((c.projects||[]).length===1){
    let total=entries.reduce((s,e)=>s+(Number(e.durationMs)||0),0);
    if(activeTimeSession?.clientId===c.id&&(!lastClose||activeTimeSession.startedAt>lastClose))total+=Math.max(0,Date.now()-activeTimeSession.startedAt);
    return total;
  }
  let total=entries.filter(e=>(e.projectId||'')===p.id).reduce((s,e)=>s+(Number(e.durationMs)||0),0);
  if(activeTimeSession?.clientId===c.id&&(activeTimeSession.projectId||'')===p.id&&(!lastClose||activeTimeSession.startedAt>lastClose))total+=Math.max(0,Date.now()-activeTimeSession.startedAt);
  return total;
}
function latestClosure(p){return (p.closures||[]).slice().sort((a,b)=>new Date(b.closedAt)-new Date(a.closedAt))[0]||null}

let appRoutingEnabled=false;

function pushRoute(route, replace=false){
  if(!appRoutingEnabled) return;
  try{
    if(replace) history.replaceState(route,'');
    else history.pushState(route,'');
  }catch(e){
    console.warn('Router interno non disponibile',e);

}

function renderSection(p){
  closeTimeSession('uscita-cliente');activeProjectId='';
  activeView='section';
  cur=null;
  activate(p);
  crumb.textContent='ClientPro';
  title.textContent={home:'Dashboard',clients:'Clienti',commercial:'Trova clienti',analysis:'Analisi',problems:'Problemi',projects:'Progetti',tasks:'Attività'}[p]||'Dashboard';
  const fn={home,clients,commercial,analysis,problems,projects,tasks}[p]||home;
  fn();

function restoreRoute(route){
  if(!route){renderSection('home');return}
  if(route.view==='section'){renderSection(route.page||'home');return}
  if(route.view==='client'){openClient(route.clientId,route.tab||'overview',false);return}
  if(route.view==='interview'){
    const c=db.clients.find(x=>x.id===route.clientId);
    if(c){activeView='interview';cur=c;tab='interview';activate('');ensureClientData(cur);ensureInterview(cur);renderInterview();syncTimeContext();window.scrollTo(0,0)}
    else renderSection('clients');
    return;
  }
  if(route.view==='questionnairePreview'){
    const c=db.clients.find(x=>x.id===route.clientId);
    if(c){cur=c;tab='analysis';activate('');renderSelfQuestionnaire(false);window.scrollTo(0,0)}
    else renderSection('clients');
    return;
  }
  if(route.view==='problemWorkspace'){
    const c=db.clients.find(x=>x.id===route.clientId);
    if(c){cur=c;v13LegacyIndex=route.legacyIndex??null;loadProblemWorkspace(route.problemId,route.section||'overview',false)}
    else renderSection('clients');
    return;
  }
  renderSection('home');
}

window.addEventListener('popstate',e=>{
  if(!appRoutingEnabled) return;
  restoreRoute(e.state||{view:'section',page:'home'});
});

async function importData(file){
  if(!file)return;
  try{
    const obj=JSON.parse(await file.text());
    const incoming=obj.data||obj;
    if(!incoming||!Array.isArray(incoming.clients))throw new Error('File non valido');
    if(!confirm('Sostituire i dati attuali con questo backup?'))return;
    db=incoming;ensureAllData();save();modal.close();applyTheme();go('home',false);alert('Backup importato correttamente.');
  }catch(e){alert('Il file selezionato non è un backup ClientPro valido.')}
}

function quickInterview(){
  const available=db.clients.filter(c=>!c.archived);if(!available.length){newClient();return}
  show(`<h2>Inizia intervista</h2><label>Seleziona cliente</label><select id="qc">${available.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button class="primary" onclick="const id=qc.value;modal.close();startInterviewForClient(id)">Apri intervista</button>`)
}
function quickQuestionnaire(){
  const available=db.clients.filter(c=>!c.archived);if(!available.length){newClient();return}
  show(`<h2>Invia questionario</h2><label>Seleziona cliente</label><select id="qqc">${available.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button class="primary" onclick="modal.close();openClient(qqc.value,'analysis');setTimeout(prepareQuestionnaire,50)">Continua</button>`)

function miniClients(a){return a.length?`<div class=list>${a.map(c=>`<div class="item click" onclick="openClient('${c.id}')"><b>${esc(c.name)}</b><div class=mut>${esc(c.contact||'Nessun referente')} · ${c.archived?'Concluso':esc(c.status)}</div></div>`).join('')}</div>`:'<div class=empty>Nessun cliente.</div>'}
function clients(){
  ensureAllData();
  const active=db.clients.filter(c=>!c.archived),closed=db.clients.filter(c=>c.archived);
  if(clientListMode==='closed'&&!closed.length&&active.length)clientListMode='active';
  view.innerHTML=`<div class=clientListTabs><button class="${clientListMode==='active'?'on':''}" onclick="clientListMode='active';clients()">Attivi (${active.length})</button><button class="${clientListMode==='closed'?'on':''}" onclick="clientListMode='closed';clients()">Conclusi (${closed.length})</button></div>
  <input id="search" placeholder="Cerca attività, referente, indirizzo, telefono o e-mail..." oninput="refreshClientList(this.value)"><div id=clientList></div>`;
  refreshClientList('');
}
function refreshClientList(q=''){
  const source=db.clients.filter(c=>clientListMode==='closed'?c.archived:!c.archived);
  const term=String(q||'').toLowerCase();
  const filtered=source.filter(c=>[c.name,c.contact,c.phone,c.email,c.sector,addressText(c),c.address?.operational].join(' ').toLowerCase().includes(term));
  clientList.innerHTML=clientHTML(filtered);
}
function clientHTML(a){return a.length?`<div class=list>${a.map(c=>`<div class="card click" onclick="openClient('${c.id}')"><div class="row between"><div><b>${esc(c.name)}</b><div class=mut>${esc(c.contact||'Nessun referente')}${c.phone?' · '+esc(c.phone):''}</div>${addressText(c)?`<small class=mut>${esc(addressText(c))}</small><br>`:''}<small class=mut>${esc(c.archived?'Cliente concluso':c.next||'Nessuna prossima azione')}</small></div><span class="pill ${c.archived?'archiveBadge':''}">${c.archived?'Concluso':esc(c.status)}</span></div></div>`).join('')}</div>`:`<div class="card empty">${clientListMode==='closed'?'Nessun cliente concluso.':'Nessun cliente attivo.'}</div>`}
function analysis(){let a=db.clients.filter(c=>!c.archived&&(c.interview||c.questionnaire));view.innerHTML=a.length?a.map(c=>`<div class="card click" onclick="openClient('${c.id}','analysis')"><div class="row between"><div><b>${esc(c.name)}</b><div class=mut>Intervista: ${c.interview?interviewProgress(c)+'%':'non iniziata'} · Questionario: ${esc(c.questionnaire?.status||'non inviato')}</div></div><span class=pill>Apri</span></div></div>`).join(''):'<div class="card empty">Avvia un’analisi dalla scheda cliente.</div>'}
function projects(){let a=db.clients.flatMap(c=>(c.projects||[]).map(p=>({c,p})));view.innerHTML=a.length?a.map(x=>`<div class="card projectCard" onclick="openClient('${x.c.id}','projects');setTimeout(()=>openProject('${x.p.id}'),30)"><div class="row between"><div><b>${esc(x.p.name)}</b><div class=mut>${esc(x.c.name)} · ${projectLabel(x.p)}</div></div><span class=pill>${esc(x.p.status)}</span></div></div>`).join(''):'<div class="card empty">Nessun progetto.</div>'}

const GEO_KEY_STORE='clientpro_geoapify_key_v128';
let commercialTab='search',commercialResults=[],commercialSearchMeta=null,activeLeadId='',manualLookupCache=null;
const COMMERCIAL_CATEGORIES={
  tattoo:{label:'Tattoo / piercing',api:['service.beauty.tattoo']},
  hair:{label:'Parrucchieri / barber',api:['service.beauty.hairdresser']},
  beauty:{label:'Centri estetici / nail',api:['service.beauty']},
  vehicle:{label:'Officine / gommisti',api:['service.vehicle.repair','service.vehicle.repair.car','service.vehicle.repair.motorcycle']},
  other:{label:'Altre attività di servizio compatibili',api:['service.photographer','service.tailor','service.shoemaker']}
};
const PROBLEM_TAGS={appointments:'Appuntamenti / prenotazioni',collaborators:'Collaboratori',stock:'Materiali / scorte',communication:'Informazioni / comunicazioni',tasks:'Attività dimenticate',prep:'Preparazione lavori',payments:'Caparre / pagamenti',organization:'Organizzazione generale'};
const LEAD_STATUS={to_contact:'Da contattare',contacted:'Contattato',replied:'Ha risposto',interested:'Interessato',appointment:'Appuntamento fissato',no_response:'Nessuna risposta',not_interested:'Non interessato',converted:'Cliente',blocked:'Non contattare'};
function getGeoKey(){try{return localStorage.getItem(GEO_KEY_STORE)||''}catch(e){return ''}}
function saveCommercialSettings(){
  try{localStorage.setItem(GEO_KEY_STORE,(document.getElementById('geoKeySetting')?.value||'').trim())}catch(e){}
  db.commercial=db.commercial||{};db.commercial.privacyNoticeUrl=(document.getElementById('privacyUrlSetting')?.value||'').trim();db.commercial.signature=(document.getElementById('signatureSetting')?.value||'').trim();save();alert('Impostazioni commerciali salvate.');
}
function plusDaysIso(days,base=new Date()){const d=new Date(base);d.setDate(d.getDate()+Number(days||0));return d.toISOString()}
function leadFingerprint(x){const n=String(x?.name||'').toLowerCase().replace(/[^a-z0-9à-ÿ]/gi,'');const loc=String(x?.city||x?.address||'').toLowerCase().replace(/[^a-z0-9à-ÿ]/gi,'');const ph=String(x?.phone||'').replace(/\D/g,'');const em=String(x?.email||'').trim().toLowerCase();let host='';try{host=new URL(/^https?:/i.test(x?.website||'')?x.website:'https://'+(x?.website||'')).hostname.replace(/^www\./,'')}catch(e){}return [n,loc,ph,em,host].filter(Boolean).join('|')}
function ensureLeadData(l){
  if(!l)return l;if(!l.id)l.id=crypto.randomUUID();if(!l.status)l.status='to_contact';if(!l.createdAt)l.createdAt=new Date().toISOString();if(!Array.isArray(l.history))l.history=[];if(!Array.isArray(l.signals))l.signals=[];if(!Array.isArray(l.problemTags))l.problemTags=[];if(!l.privacy||typeof l.privacy!=='object')l.privacy={};
  if(!Array.isArray(l.privacy.allowedChannels))l.privacy.allowedChannels=[];if(l.privacy.doNotContact==null)l.privacy.doNotContact=false;if(!l.privacy.collectedAt)l.privacy.collectedAt=l.createdAt;if(!l.privacy.reviewAt)l.privacy.reviewAt=plusDaysIso(db.commercial?.reviewDays||90,new Date(l.privacy.collectedAt));if(!l.privacy.source)l.privacy.source=l.source||'Inserimento manuale';if(!l.privacy.legalBasis)l.privacy.legalBasis='Da verificare';
  if(l.followupCount==null)l.followupCount=0;if(l.fingerprint==null)l.fingerprint=leadFingerprint(l);return l;
}
function ensurePackageData(p){if(!p)return p;if(!p.id)p.id=crypto.randomUUID();if(p.active==null)p.active=true;if(!Array.isArray(p.problemTags))p.problemTags=[];if(!p.messages)p.messages={whatsapp:'',email:'',social:''};['whatsapp','email','social'].forEach(k=>{if(p.messages[k]==null)p.messages[k]=''});return p}
function ensureDefaultCommercialPackage(){if(db.commercial?.packagesSeeded)return;if(db.packages.length){db.commercial.packagesSeeded=true;return}const p=ensurePackageData({id:crypto.randomUUID(),name:'Analisi organizzativa',description:'Analisi dell’organizzazione quotidiana, individuazione delle criticità e proposta di possibili soluzioni.',includes:'Intervista o questionario, analisi dei problemi, priorità, proposta di soluzione e piano operativo.',price:'',problemTags:Object.keys(PROBLEM_TAGS),active:true,messages:{whatsapp:'Buongiorno {attivita}, mi occupo di aiutare piccole attività di servizio a individuare passaggi organizzativi che fanno perdere tempo o creano difficoltà nella gestione quotidiana. {leva} Se può essere utile, posso spiegarvi brevemente come funziona {pacchetto}. {firma}',email:'Buongiorno {attivita},\n\nmi occupo di analisi organizzativa per piccole attività di servizio, con l’obiettivo di individuare passaggi che fanno perdere tempo, informazioni disperse o attività difficili da controllare.\n\n{leva}\n\nSe può essere utile, posso presentarvi brevemente {pacchetto} e capire insieme se ha senso approfondire.\n\n{firma}',social:'Buongiorno {attivita}, mi occupo di organizzazione per piccole attività di servizio. {leva} Se vi fa piacere, posso spiegarvi in breve {pacchetto}. {firma}'}});db.packages.push(p);db.commercial.packagesSeeded=true}
function logLead(l,text){ensureLeadData(l);l.history.unshift({id:crypto.randomUUID(),text,date:new Date().toISOString()})}
function leadDuplicateInfo(x){
  const fp=leadFingerprint(x),normName=String(x?.name||'').trim().toLowerCase(),normCity=String(x?.city||'').trim().toLowerCase(),phone=String(x?.phone||'').replace(/\D/g,''),email=String(x?.email||'').trim().toLowerCase();
  const sameNameCity=o=>String(o?.name||'').trim().toLowerCase()===normName&&(!normCity||!o?.city||String(o.city).trim().toLowerCase()===normCity);
  const client=db.clients.find(c=>sameNameCity(c)||(phone&&String(c.phone||'').replace(/\D/g,'')===phone)||(email&&String(c.email||'').toLowerCase()===email));if(client)return {type:'client',label:'Cliente già presente',id:client.id};
  const lead=db.leads.find(l=>l.fingerprint===fp||sameNameCity(l)||(phone&&String(l.phone||'').replace(/\D/g,'')===phone)||(email&&String(l.email||'').toLowerCase()===email));if(lead)return {type:'lead',label:LEAD_STATUS[lead.status]||'Potenziale cliente già presente',id:lead.id};
  const sup=db.leadSuppressions.find(s=>s.fingerprint===fp);if(sup)return {type:'suppression',label:'Escluso dalle ricerche',id:sup.id};return null;
}
function commercial(pushState=false){
  ensureAllData();activate('commercial');
  view.innerHTML=`<div class=commercialTabs>${[['search','Trova clienti'],['leads','Potenziali'],['packages','Pacchetti'],['archive','Archivio']].map(x=>`<button class="${commercialTab===x[0]?'on':''}" onclick="commercialTab='${x[0]}';commercial()">${x[1]}</button>`).join('')}</div><div id=commercialBody></div>`;
  if(commercialTab==='search')renderCommercialSearch();if(commercialTab==='leads')renderLeadPipeline();if(commercialTab==='packages')renderPackages();if(commercialTab==='archive')renderLeadArchive();
}
function renderCommercialSearch(){
  const key=!!getGeoKey(),last=db.commercial?.lastSearch||{};
  commercialBody.innerHTML=`<div class=card><div class="row between"><div><h2>Ricerca potenziali clienti</h2><p class=mut>ClientPro cerca attività compatibili. I risultati non vengono salvati finché non li selezioni.</p></div><div class="providerStatus ${key?'ok':''}"><span class=dot></span><span>${key?'Motore collegato':'Motore da collegare'}</span></div></div>${!key?'<div class=commercialNotice>Per eseguire la ricerca reale serve una chiave gratuita Geoapify. Puoi inserirla in Account → Acquisizione clienti.</div>':''}
  <div class=searchGrid style="margin-top:12px"><div class=full><label>Tipi di attività</label><div class=choiceGrid>${Object.entries(COMMERCIAL_CATEGORIES).map(([k,v])=>`<label><input type=checkbox name=leadCat value="${k}" ${!last.categories||last.categories.includes(k)?'checked':''}> ${v.label}</label>`).join('')}</div></div>
  <div><label>Area di ricerca</label><select id=geoMode onchange=toggleGeoRadius()><option value=municipality ${last.geoMode==='municipality'?'selected':''}>Comune</option><option value=radius ${(!last.geoMode||last.geoMode==='radius')?'selected':''}>Comune + raggio</option><option value=province ${last.geoMode==='province'?'selected':''}>Provincia</option><option value=region ${last.geoMode==='region'?'selected':''}>Regione</option></select></div>
  <div><label>Località</label><input id=geoPlace value="${esc(last.place||'')}" placeholder="Es. Casorate Primo"></div><div id=radiusBox><label>Raggio</label><select id=geoRadius>${[10,25,50,75,100].map(n=>`<option value=${n} ${Number(last.radius||25)===n?'selected':''}>${n} km</option>`).join('')}</select></div>
  <div><label>Dimensione preferita</label><select id=teamSize><option ${last.team==='2-5'?'selected':''}>2-5</option><option ${last.team==='1'?'selected':''}>1</option><option ${last.team==='6-10'?'selected':''}>6-10</option><option ${last.team==='10+'?'selected':''}>10+</option><option ${last.team==='Qualsiasi'?'selected':''}>Qualsiasi</option></select><small class=mut>La dimensione è un criterio da verificare dopo la ricerca: i database pubblici spesso non la indicano.</small></div>
  <div><label>Numero risultati</label><input id=resultLimit type=number min=1 max=100 value="${Number(last.limit)||20}"></div><div class=full><button class=primary onclick=startLeadSearch()>⌕ Cerca potenziali clienti</button></div></div></div><div id=searchResults></div>`;
  toggleGeoRadius();renderSearchResults();

function toggleGeoRadius(){const el=document.getElementById('radiusBox');if(el)el.style.display=document.getElementById('geoMode')?.value==='radius'?'block':'none'}
function selectedCommercialCategories(){return [...document.querySelectorAll('input[name=leadCat]:checked')].map(x=>x.value)}
async function geoJson(url){const r=await fetch(url);if(!r.ok)throw new Error('Servizio di ricerca non disponibile ('+r.status+').');return await r.json()}
async function geocodeCommercialPlace(place,key){const q=encodeURIComponent(place+', Italia'),url=`https://api.geoapify.com/v1/geocode/search?text=${q}&filter=countrycode:it&format=json&limit=5&lang=it&apiKey=${encodeURIComponent(key)}`;const data=await geoJson(url);return data.results?.[0]||null}
async function startLeadSearch(){
  const key=getGeoKey();if(!key)return alert('Inserisci prima la chiave Geoapify in Account → Acquisizione clienti.');const cats=selectedCommercialCategories();if(!cats.length)return alert('Seleziona almeno un tipo di attività.');const place=(geoPlace.value||'').trim();if(!place)return alert('Inserisci il Comune, la Provincia o la Regione.');
  const geoMode=document.getElementById('geoMode').value,radius=Number(document.getElementById('geoRadius')?.value||25),limit=Math.max(1,Math.min(100,Number(resultLimit.value)||20)),team=teamSize.value;
  db.commercial.lastSearch={categories:cats,geoMode,place,radius,limit,team};save();
  searchResults.innerHTML='<div class="card empty">Ricerca in corso…</div>';
  try{
    const g=await geocodeCommercialPlace(place,key);if(!g)throw new Error('Località non trovata.');const apiCats=[...new Set(cats.flatMap(k=>COMMERCIAL_CATEGORIES[k]?.api||[]))];
    let filter='',bias=`proximity:${g.lon},${g.lat}`;if(geoMode==='radius')filter=`circle:${g.lon},${g.lat},${radius*1000}`;else if(g.place_id)filter=`place:${g.place_id}`;else filter=`circle:${g.lon},${g.lat},${geoMode==='municipality'?15000:geoMode==='province'?60000:150000}`;
    const url=`https://api.geoapify.com/v2/places?categories=${encodeURIComponent(apiCats.join(','))}&filter=${encodeURIComponent(filter)}&bias=${encodeURIComponent(bias)}&limit=${limit}&lang=it&apiKey=${encodeURIComponent(key)}`;const data=await geoJson(url);
    const seen=new Set();commercialResults=(data.features||[]).map(f=>normalizeGeoFeature(f)).filter(r=>r.name&&!seen.has(r.placeId)&&(seen.add(r.placeId),true));commercialSearchMeta={place,geoMode,radius,team,at:new Date().toISOString(),center:{lat:g.lat,lon:g.lon}};renderSearchResults();
  }catch(e){console.error(e);searchResults.innerHTML=`<div class="card empty">${esc(e.message||'Ricerca non riuscita.')}</div>`}
}
function normalizeGeoFeature(f){const p=f?.properties||{};return {placeId:p.place_id||crypto.randomUUID(),name:p.name||p.address_line1||'',category:(p.categories||[])[0]||'',categories:p.categories||[],address:p.formatted||[p.street,p.housenumber,p.city].filter(Boolean).join(' '),city:p.city||p.town||p.village||'',postcode:p.postcode||'',province:p.county||p.state||'',street:p.street||'',housenumber:p.housenumber||'',lat:p.lat,lon:p.lon,distance:Number(p.distance)||0,website:p.website||'',phone:p.contact?.phone||'',email:p.contact?.email||'',openingHours:p.opening_hours||'',source:'Geoapify / OpenStreetMap',sourceId:p.place_id||'',raw:p,detailsLoaded:false,signals:[],problemTags:[]}}
function renderSearchResults(){const box=document.getElementById('searchResults');if(!box)return;if(!commercialResults.length){box.innerHTML='<div class="card empty">Imposta i criteri e avvia una ricerca.</div>';return}box.innerHTML=`<div class="row between"><h3>Risultati (${commercialResults.length})</h3><small class=mut>I risultati restano temporanei finché non premi Salva.</small></div><div class=list>${commercialResults.map((r,i)=>searchResultHTML(r,i)).join('')}</div><div class=mut style="margin-top:8px">Dati luogo: Geoapify / © OpenStreetMap contributors. Le possibili criticità devono essere confermate prima di usarle commercialmente.</div>`}
function searchResultHTML(r,i){const dup=leadDuplicateInfo(r),dist=r.distance?`${(r.distance/1000).toFixed(1)} km`:'';return `<div class="card searchResult ${dup?'blocked':''}"><div class="row between"><div><h3>${esc(r.name)}</h3><div class=mut>${esc(r.city||r.address)}${dist?' · '+dist:''}</div></div>${dup?`<span class="pill orange">${esc(dup.label)}</span>`:'<span class="pill blue">Nuovo</span>'}</div><div class=leadMeta>${r.phone?'<span>☎ '+esc(r.phone)+'</span>':''}${r.email?'<span>✉ '+esc(r.email)+'</span>':''}${r.website?'<span>🌐 Sito</span>':''}<span>${esc(categoryFriendly(r))}</span></div><div class=mut>${esc(r.address||'Indirizzo non disponibile')}</div><div class=resultActions><button onclick="analyzeSearchResult(${i})">Analizza</button><button ${dup?'disabled':''} class=primary onclick="saveSearchResult(${i})">Salva</button><button onclick="discardSearchResult(${i},false)">Scarta</button><button class=dangerBtn onclick="discardSearchResult(${i},true)">Non mostrarmela più</button></div></div>`}
function categoryFriendly(r){const cats=r.categories||[];if(cats.some(x=>x.includes('tattoo')))return 'Tattoo / piercing';if(cats.some(x=>x.includes('hairdresser')))return 'Parrucchiere / barber';if(cats.some(x=>x.includes('beauty')))return 'Beauty / estetica';if(cats.some(x=>x.includes('vehicle.repair')))return 'Officina / assistenza';return 'Servizi'}
async function fetchPlaceDetails(r){if(r.detailsLoaded||!r.sourceId)return r;const key=getGeoKey();if(!key)return r;try{const url=`https://api.geoapify.com/v2/place-details?id=${encodeURIComponent(r.sourceId)}&features=details&lang=it&apiKey=${encodeURIComponent(key)}`;const data=await geoJson(url);const p=(data.features||[]).find(f=>f.properties?.feature_type==='details')?.properties||(data.features||[])[0]?.properties||{};r.website=p.website||r.website||'';r.phone=p.contact?.phone||r.phone||'';r.email=p.contact?.email||r.email||'';r.openingHours=p.opening_hours||r.openingHours||'';r.social=p.contact?.social||p.social||{};r.socialUrl=p.contact?.instagram||p.instagram||p.facebook||p.contact?.facebook||r.socialUrl||'';r.brand=p.brand||'';r.rawDetails=p;r.detailsLoaded=true;deriveLeadSignals(r);return r}catch(e){console.warn('Dettagli luogo non disponibili',e);r.detailsLoaded=true;deriveLeadSignals(r);return r}}
function deriveLeadSignals(r){const signals=[],tags=new Set();const cat=categoryFriendly(r);if(['Tattoo / piercing','Parrucchiere / barber','Beauty / estetica'].includes(cat)){signals.push({type:'possible',confidence:'Media',text:'Attività normalmente compatibile con una gestione su appuntamento.',tag:'appointments'});tags.add('appointments')}if(cat==='Officina / assistenza'){signals.push({type:'possible',confidence:'Media',text:'Attività compatibile con appuntamenti, preparazione lavori e gestione materiali/ricambi.',tag:'prep'});tags.add('prep');tags.add('stock')}if(!r.website){signals.push({type:'signal',confidence:'Media',text:'Nessun sito ufficiale rilevato nei dati disponibili.',tag:'organization'});tags.add('organization')}else{signals.push({type:'signal',confidence:'Alta',text:'Sito ufficiale rilevato: può essere controllato prima del contatto.',tag:'organization'});tags.add('organization')}const w=String(r.website||'').toLowerCase();const booking=['treatwell','booksy','fresha','uala','simplybook','setmore','calendly','timify','mindbody'];if(booking.some(x=>w.includes(x)))signals.push({type:'signal',confidence:'Alta',text:'È stato rilevato un servizio di prenotazione online nel link disponibile.',tag:'appointments',positive:true});else signals.push({type:'possible',confidence:'Debole',text:'Nessun sistema di prenotazione è stato rilevato nei dati disponibili: da verificare sul sito/social.',tag:'appointments'});if(r.phone)signals.push({type:'signal',confidence:'Alta',text:'Numero di contatto pubblico disponibile.',tag:'communication'});r.signals=signals;r.problemTags=[...new Set([...tags,...signals.map(x=>x.tag).filter(Boolean)])];return r}
async function analyzeSearchResult(i){const r=commercialResults[i];if(!r)return;show('<div class="card empty">Analisi dei dati pubblici disponibili…</div>');await fetchPlaceDetails(r);const dup=leadDuplicateInfo(r);const rec=recommendedPackageForData(r);show(`<div class=modalHead><div><h2>${esc(r.name)}</h2><div class=mut>${esc(r.address||'')}</div></div><button class=modalClose onclick="modal.close()">×</button></div><div class=section>ANALISI PRE-CONTATTO</div><div class=commercialNotice>ClientPro distingue tra segnali trovati e possibili criticità. Nessuna ipotesi viene presentata come certezza.</div><div class=signalList>${(r.signals||[]).map(s=>`<div class=signal><b>${s.type==='signal'?'Segnale rilevato':'Possibile criticità'} · ${esc(s.confidence)}</b><div>${esc(s.text)}</div></div>`).join('')}</div><div class=section>DATI PUBBLICI</div><div class=item><b>Telefono</b><div class=mut>${esc(r.phone||'Non rilevato')}</div></div><div class=item><b>E-mail</b><div class=mut>${esc(r.email||'Non rilevata')}</div></div><div class=item><b>Sito</b><div class=mut>${r.website?`<a href="${esc(r.website)}" target=_blank rel=noopener>${esc(r.website)}</a>`:'Non rilevato'}</div></div><div class=item><b>Dimensione 2-5 persone</b><div class=mut>Da verificare: questo dato normalmente non è disponibile nella fonte luoghi.</div></div>${rec?`<div class=section>PACCHETTO SUGGERITO</div><div class=item><b>${esc(rec.name)}</b><div class=mut>${esc(packageWhy(rec,r))}</div></div>`:''}<div class=section>AZIONI</div><div class=softActions><button class=primary ${dup?'disabled':''} onclick="modal.close();saveSearchResult(${i})">Salva tra i potenziali</button><button onclick="modal.close()">Chiudi</button></div>`)}
function saveSearchResult(i){const r=commercialResults[i];if(!r)return;const dup=leadDuplicateInfo(r);if(dup)return alert(dup.label+'.');deriveLeadSignals(r);const l=ensureLeadData({id:crypto.randomUUID(),name:r.name,sector:categoryFriendly(r),address:r.address,city:r.city,postcode:r.postcode,province:r.province,lat:r.lat,lon:r.lon,phone:r.phone,email:r.email,website:r.website,street:r.street||'',housenumber:r.housenumber||'',socialUrl:r.socialUrl||'',source:r.source,sourceId:r.sourceId,status:'to_contact',createdAt:new Date().toISOString(),signals:r.signals||[],problemTags:r.problemTags||[],notes:'',history:[],privacy:{source:r.source,collectedAt:new Date().toISOString(),reviewAt:plusDaysIso(db.commercial?.reviewDays||90),legalBasis:'Da verificare',allowedChannels:[],doNotContact:false}});logLead(l,'Potenziale cliente salvato dalla ricerca');db.leads.unshift(l);save();renderSearchResults();alert('Salvato tra i potenziali clienti.')}
function discardSearchResult(i,permanent){const r=commercialResults[i];if(!r)return;if(permanent){const fp=leadFingerprint(r);db.leadSuppressions.push({id:crypto.randomUUID(),fingerprint:fp,nameNorm:String(r.name||'').trim().toLowerCase(),name:r.name,reason:'Non mostrarmela più',date:new Date().toISOString()});save()}commercialResults.splice(i,1);renderSearchResults()}
function newManualLead(){manualLookupCache=null;show(`<h2>Inserisci attività</h2><p class=mut>Aggiungi un potenziale cliente che conosci già. Se il motore è collegato, ClientPro può provare a recuperare automaticamente i dati pubblici.</p><label>Nome attività *</label><input id=mlName><label>Settore</label><select id=mlSector>${Object.values(COMMERCIAL_CATEGORIES).map(v=>`<option>${v.label}</option>`).join('')}</select><label>Comune</label><input id=mlCity><div class=softActions><button onclick=lookupManualLead()>⌕ Cerca dati attività</button></div><div id=mlLookupState class=mut></div><label>Indirizzo</label><input id=mlAddress><div class=grid2><div><label>Telefono</label><input id=mlPhone></div><div><label>E-mail</label><input id=mlEmail type=email></div></div><label>Sito</label><input id=mlWebsite placeholder="https://..."><label>Instagram / social</label><input id=mlSocial placeholder="https://..."><label>Note</label><textarea id=mlNotes></textarea><button class=primary onclick=saveManualLead()>Salva potenziale cliente</button>`)}
async function lookupManualLead(){const key=getGeoKey();if(!key)return alert('Collega prima Geoapify in Account → Acquisizione clienti.');const name=mlName.value.trim(),city=mlCity.value.trim();if(!name||!city)return alert('Inserisci nome attività e Comune.');mlLookupState.textContent='Ricerca dati pubblici…';try{const g=await geocodeCommercialPlace(name+', '+city,key);if(!g)throw new Error('Attività non trovata.');const r={placeId:g.place_id||crypto.randomUUID(),sourceId:g.place_id||'',name:g.name||name,address:g.formatted||'',city:g.city||city,postcode:g.postcode||'',province:g.county||g.state||'',street:g.street||'',housenumber:g.housenumber||'',lat:g.lat,lon:g.lon,website:'',phone:'',email:'',socialUrl:'',detailsLoaded:false,categories:g.category?[g.category]:[],signals:[],problemTags:[],source:'Geoapify / OpenStreetMap'};await fetchPlaceDetails(r);manualLookupCache=r;mlName.value=r.name||name;mlCity.value=r.city||city;mlAddress.value=r.address||'';mlPhone.value=r.phone||'';mlEmail.value=r.email||'';mlWebsite.value=r.website||'';mlSocial.value=r.socialUrl||'';mlLookupState.textContent='Dati pubblici trovati. Controllali prima di salvare.'}catch(e){console.warn(e);mlLookupState.textContent=e.message||'Nessun dato trovato.'}}
function saveManualLead(){if(!mlName.value.trim())return alert('Inserisci il nome dell’attività.');const draft={name:mlName.value.trim(),sector:mlSector.value,city:mlCity.value.trim(),address:mlAddress.value.trim(),phone:mlPhone.value.trim(),email:mlEmail.value.trim(),website:mlWebsite.value.trim(),socialUrl:mlSocial.value.trim()};const dup=leadDuplicateInfo(draft);if(dup)return alert(dup.label+'.');const src=manualLookupCache?'Geoapify / OpenStreetMap':'Inserimento manuale';const l=ensureLeadData({id:crypto.randomUUID(),...draft,street:manualLookupCache?.street||'',housenumber:manualLookupCache?.housenumber||'',postcode:manualLookupCache?.postcode||'',province:manualLookupCache?.province||'',lat:manualLookupCache?.lat,lon:manualLookupCache?.lon,sourceId:manualLookupCache?.sourceId||'',notes:mlNotes.value.trim(),status:'to_contact',createdAt:new Date().toISOString(),source:src,signals:manualLookupCache?.signals||[],problemTags:manualLookupCache?.problemTags||[],history:[],privacy:{source:src,collectedAt:new Date().toISOString(),reviewAt:plusDaysIso(db.commercial?.reviewDays||90),legalBasis:'Da verificare',allowedChannels:[],doNotContact:false}});logLead(l,'Potenziale cliente inserito manualmente');db.leads.unshift(l);save();modal.close();commercialTab='leads';commercial()}

function leadStatusClass(l){if(l.status==='interested'||l.status==='appointment'||l.status==='converted')return 'green';if(l.status==='not_interested'||l.status==='blocked')return 'archiveBadge';if(l.status==='contacted'||l.status==='replied')return 'orange';return 'blue'}
function renderLeadPipeline(){const active=db.leads.filter(l=>!['not_interested','no_response','converted','blocked'].includes(l.status));const due=active.filter(l=>l.nextFollowUp&&new Date(l.nextFollowUp)<=new Date()).length;commercialBody.innerHTML=`<div class=pipelineCounts><div class=card><span class=mut>Da contattare</span><b>${active.filter(l=>l.status==='to_contact').length}</b></div><div class=card><span class=mut>In attesa</span><b>${active.filter(l=>l.status==='contacted').length}</b></div><div class=card><span class=mut>Interessati</span><b>${active.filter(l=>['interested','appointment'].includes(l.status)).length}</b></div><div class=card><span class=mut>Follow-up scaduti</span><b>${due}</b></div></div><div class="row between"><h3>Potenziali clienti</h3><div class=softActions><button onclick="newManualLead()">＋ Inserisci attività</button><button onclick="commercialTab='search';commercial()">⌕ Nuova ricerca</button></div></div>${active.length?`<div class=list>${active.map(leadCardHTML).join('')}</div>`:'<div class="card empty">Nessun potenziale cliente salvato.</div>'}`}
function leadCardHTML(l){const due=l.nextFollowUp&&new Date(l.nextFollowUp)<=new Date();return `<div class="card leadCard" onclick="openLead('${l.id}')"><div class="row between"><div><b>${esc(l.name)}</b><div class=mut>${esc(l.sector||'')} ${l.city?'· '+esc(l.city):''}</div><div class=leadMeta>${l.phone?'<span>☎ '+esc(l.phone)+'</span>':''}${l.website?'<span>🌐 sito</span>':''}${l.packageId?'<span>Pacchetto assegnato</span>':''}</div>${due?'<div class=leadDue>Follow-up da fare</div>':''}</div><span class="pill ${leadStatusClass(l)}">${esc(LEAD_STATUS[l.status]||l.status)}</span></div></div>`}
function privacyState(l,channel=''){ensureLeadData(l);if(l.privacy.doNotContact||l.status==='blocked'||l.status==='not_interested')return {level:'block',label:'Non contattare'};if(channel&&l.privacy.allowedChannels.includes(channel)&&l.privacy.legalBasis!=='Da verificare'&&db.commercial?.privacyNoticeUrl)return {level:'ok',label:'Contatto verificato'};return {level:'warn',label:'Da verificare'}}
function recommendedPackageForData(x){const active=db.packages.filter(p=>p.active);if(!active.length)return null;const tags=new Set(x.problemTags||[]);let best=null,score=-1;active.forEach(p=>{const s=(p.problemTags||[]).filter(t=>tags.has(t)).length;if(s>score){score=s;best=p}});return best}
function packageWhy(p,x){const matches=(p.problemTags||[]).filter(t=>(x.problemTags||[]).includes(t)).map(t=>PROBLEM_TAGS[t]);return matches.length?'Compatibile con: '+matches.join(', ')+'.':'È un pacchetto attivo: verifica manualmente che sia adatto prima dell’invio.'}
function openLead(id){const l=db.leads.find(x=>x.id===id);if(!l)return;ensureLeadData(l);activeLeadId=id;const rec=recommendedPackageForData(l),pkg=db.packages.find(p=>p.id===l.packageId)||rec;const ps=privacyState(l);show(`<div class=modalHead><div><h2>${esc(l.name)}</h2><div class=mut>${esc(l.sector||'')} ${l.city?'· '+esc(l.city):''}</div></div><button class=modalClose onclick="modal.close()">×</button></div><div class="row between"><span class="pill ${leadStatusClass(l)}">${esc(LEAD_STATUS[l.status]||l.status)}</span><span class="privacyStatus ${ps.level}">${ps.level==='ok'?'●':ps.level==='block'?'●':'●'} ${ps.label}</span></div><div class=section>ANALISI PRE-CONTATTO</div><div class=signalList>${l.signals.length?l.signals.map(s=>`<div class=signal><b>${s.type==='signal'?'Segnale':'Possibile criticità'} · ${esc(s.confidence||'')}</b><div>${esc(s.text||'')}</div></div>`).join(''):'<div class=mut>Nessun segnale salvato.</div>'}</div><label>Aree da approfondire</label><div class=choiceGrid>${Object.entries(PROBLEM_TAGS).map(([k,v])=>`<label><input type=checkbox name=leadTag value="${k}" ${l.problemTags.includes(k)?'checked':''} onchange="updateLeadTags('${l.id}')"> ${v}</label>`).join('')}</div><div class=section>PACCHETTO</div>${db.packages.filter(p=>p.active).length?`<select id=leadPackage onchange="setLeadPackage('${l.id}',this.value)"><option value="">Nessun pacchetto</option>${db.packages.filter(p=>p.active).map(p=>`<option value="${p.id}" ${(l.packageId||pkg?.id)===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>${pkg?`<p class=mut>${esc(packageWhy(pkg,l))}</p>`:''}`:'<div class=commercialNotice>Non hai ancora creato pacchetti. Apri la scheda Pacchetti per aggiungerne uno.</div>'}<div class=section>PRIVACY E CONTATTO</div>${privacyLeadHTML(l)}<div class=section>AZIONI</div><div class=softActions><button class=primary onclick="composeLeadMessage('${l.id}')">Prepara messaggio</button>${l.status==='contacted'?`<button onclick="registerLeadResponse('${l.id}')">Registra risposta</button><button onclick="sendFollowup('${l.id}')">Follow-up</button>`:''}${l.status==='replied'||l.status==='interested'?`<button onclick="registerLeadResponse('${l.id}')">Aggiorna risposta</button>`:''}${l.status==='interested'?`<button onclick="scheduleLeadAppointment('${l.id}')">Fissa appuntamento</button>`:''}${l.status==='appointment'?`<button class=primary onclick="convertLeadToClient('${l.id}')">Trasforma in cliente</button>`:''}<button onclick="markLeadNotInterested('${l.id}')">Non interessato</button><button class=dangerBtn onclick="blockLead('${l.id}')">Non contattare</button></div><div class=section>CRONOLOGIA</div>${l.history.length?l.history.map(h=>`<div class=item><b>${esc(h.text)}</b><div class=mut>${fmt(h.date)}</div></div>`).join(''):'<div class=mut>Nessun evento.</div>'}`)}
function privacyLeadHTML(l){const p=l.privacy,channels=[['whatsapp','WhatsApp'],['email','E-mail'],['social','Instagram / social']];return `<div class=privacyBox><div class=mut>Fonte: ${esc(p.source||'Non indicata')} · raccolto ${fmt(p.collectedAt)}</div><label>Base/condizione verificata</label><select id=leadLegalBasis onchange="setLeadLegalBasis('${l.id}',this.value)">${['Da verificare','Consenso documentato','Cliente esistente / condizione verificata','Altra base verificata esternamente'].map(x=>`<option ${p.legalBasis===x?'selected':''}>${x}</option>`).join('')}</select><label>Canali autorizzati/verificati</label><div class=choiceGrid>${channels.map(([k,v])=>`<label><input type=checkbox ${p.allowedChannels.includes(k)?'checked':''} onchange="setLeadChannel('${l.id}','${k}',this.checked)"> ${v}</label>`).join('')}</div><p class=mut>${db.commercial?.privacyNoticeUrl?'Informativa privacy configurata.':'Informativa privacy non configurata: i pulsanti di apertura canale restano bloccati.'}</p><div class="privacyStatus ${privacyState(l).level}">● ${privacyState(l).label}</div></div>`}
function updateLeadTags(id){const l=db.leads.find(x=>x.id===id);if(!l)return;l.problemTags=[...document.querySelectorAll('input[name=leadTag]:checked')].map(x=>x.value);save()}
function setLeadPackage(id,pid){const l=db.leads.find(x=>x.id===id);if(!l)return;l.packageId=pid;logLead(l,'Pacchetto aggiornato');save()}
function setLeadLegalBasis(id,v){const l=db.leads.find(x=>x.id===id);if(!l)return;l.privacy.legalBasis=v;logLead(l,'Stato privacy aggiornato');save();openLead(id)}
function setLeadChannel(id,ch,on){const l=db.leads.find(x=>x.id===id);if(!l)return;let a=l.privacy.allowedChannels;if(on&&!a.includes(ch))a.push(ch);if(!on)a=a.filter(x=>x!==ch);l.privacy.allowedChannels=a;save()}
function buildLeadMessage(l,p,channel,followup=0){const leverage=(l.signals||[]).find(s=>s.tag&&l.problemTags.includes(s.tag) && !s.positive)?.text||'Dalle informazioni pubbliche disponibili potrebbe esserci qualche passaggio organizzativo da approfondire.';let template=p?.messages?.[channel]||'';if(!template){if(followup===1)template='Ciao, ti riscrivo solo per sapere se hai avuto modo di leggere il mio messaggio precedente. Se può esserti utile, posso spiegarti in breve la proposta.';else if(followup===2)template='Ciao, questo è il mio ultimo messaggio sul tema. Se in futuro vorrai approfondire l’organizzazione dell’attività, resto disponibile.';else template='Ciao {attivita}, mi occupo di analizzare l’organizzazione di piccole attività di servizio e individuare passaggi che possono far perdere tempo o creare difficoltà. {leva} Se ti può essere utile, posso spiegarti in breve {pacchetto}.'}const values={attivita:l.name||'',comune:l.city||'',leva:leverage,pacchetto:p?.name||'la proposta',prezzo:p?.price?moneyFmt(p.price):'',firma:db.commercial?.signature||''};return template.replace(/\{(attivita|comune|leva|pacchetto|prezzo|firma)\}/g,(_,k)=>values[k]||'').replace(/[ \t]+/g,' ').trim()}
function composeLeadMessage(id,followup=0){const l=db.leads.find(x=>x.id===id);if(!l)return;const p=db.packages.find(x=>x.id===l.packageId)||recommendedPackageForData(l);if(!p&&!followup)return alert('Crea o assegna prima un pacchetto.');show(`<h2>${followup?'Follow-up':'Prepara messaggio'}</h2><p class=mut>${esc(l.name)}</p><label>Canale</label><select id=msgChannel onchange="refreshLeadMessage('${id}',${followup})"><option value=whatsapp>WhatsApp</option><option value=email>E-mail</option><option value=social>Instagram / social</option></select><label>Messaggio</label><textarea id=leadMsg class=long>${esc(buildLeadMessage(l,p,'whatsapp',followup))}</textarea><div id=privacyMsgState></div><div class=softActions><button class=primary id=openChannelBtn onclick="openLeadChannel('${id}',${followup})">Apri canale</button><button onclick="navigator.clipboard.writeText(leadMsg.value);alert('Messaggio copiato.')">Copia testo</button></div>`);refreshLeadMessage(id,followup)}
function refreshLeadMessage(id,followup=0){const l=db.leads.find(x=>x.id===id);if(!l)return;const ch=msgChannel.value,p=db.packages.find(x=>x.id===l.packageId)||recommendedPackageForData(l);leadMsg.value=buildLeadMessage(l,p,ch,followup);const st=privacyState(l,ch);privacyMsgState.innerHTML=`<p class="privacyStatus ${st.level}">● ${st.label}</p>${st.level!=='ok'?'<p class=mut>ClientPro blocca l’apertura del canale finché questo contatto non è stato verificato e l’informativa privacy non è configurata.</p>':''}`;openChannelBtn.disabled=st.level!=='ok'}
function openLeadChannel(id,followup=0){const l=db.leads.find(x=>x.id===id);if(!l)return;const ch=msgChannel.value,st=privacyState(l,ch);if(st.level!=='ok')return alert('Contatto non verificato per questo canale.');const text=leadMsg.value;let url='';if(ch==='whatsapp'){const n=String(l.phone||'').replace(/\D/g,'');if(!n)return alert('Numero WhatsApp non disponibile.');url=`https://wa.me/${n}?text=${encodeURIComponent(text)}`}if(ch==='email'){if(!l.email)return alert('E-mail non disponibile.');url=`mailto:${encodeURIComponent(l.email)}?subject=${encodeURIComponent('Contatto - '+l.name)}&body=${encodeURIComponent(text)}`}if(ch==='social'){try{navigator.clipboard.writeText(text)}catch(e){}url=l.socialUrl||'https://www.instagram.com/'}window.open(url,'_blank','noopener');show(`<h2>Conferma invio</h2><p>Il canale è stato aperto. ClientPro non può sapere se hai premuto realmente “Invia”.</p><button class=primary onclick="confirmLeadMessageSent('${id}','${ch}',${followup})">Ho inviato il messaggio</button><button onclick="modal.close()">Non l’ho inviato</button>`)}
function confirmLeadMessageSent(id,ch,followup=0){const l=db.leads.find(x=>x.id===id);if(!l)return;const now=new Date();if(!followup){l.status='contacted';l.firstContactAt=l.firstContactAt||now.toISOString();l.lastContactAt=now.toISOString();l.followupCount=0;l.nextFollowUp=plusDaysIso(7,now);logLead(l,'Primo contatto inviato via '+ch)}else{l.followupCount=(l.followupCount||0)+1;l.lastContactAt=now.toISOString();if(l.followupCount>=2){l.status='no_response';l.nextFollowUp='';logLead(l,'Secondo follow-up inviato · archiviato come Nessuna risposta')}else{l.status='contacted';l.nextFollowUp=plusDaysIso(7,now);logLead(l,'Primo follow-up inviato via '+ch)}}save();modal.close();commercialTab='leads';commercial()}

function interviewProgress(c){if(!c.interview)return 0;let a=c.interview.answers||{},filled=0;for(let i=1;i<=33;i++){let v=a[i];if(Array.isArray(v)?v.filter(Boolean).length:String(v||'').trim())filled++}return Math.round(filled/33*100)}
function ensureInterview(c){
  if(!c)return null;
  if(!c.problems)c.problems=[];
  if(!c.projects)c.projects=[];
  if(!c.interview || typeof c.interview!=='object'){
    c.interview={answers:{},notes:{},post:[],completed:false,startedAt:new Date().toISOString()};
    logEvent(c.id,'Intervista iniziata');
  }else{
    if(!c.interview.answers || typeof c.interview.answers!=='object')c.interview.answers={};
    if(!c.interview.notes || typeof c.interview.notes!=='object')c.interview.notes={};
    if(!Array.isArray(c.interview.post))c.interview.post=[];
    if(typeof c.interview.completed!=='boolean')c.interview.completed=false;
    if(!c.interview.startedAt)c.interview.startedAt=new Date().toISOString();
  }
  return c.interview;
}

function mapPriorityV13(v){return ({Alta:'high',Media:'medium',Bassa:'low',Critica:'critical'})[v]||'medium'}

async function ensureV13Ready(){
  if(!backendReady()){alert('Per usare il Workspace V13 serve la connessione cloud Supabase.');return false}
  if(!authUser && !(await recoverCloudSession())){alert('Sessione scaduta. Ricarica ClientPro e accedi di nuovo.');return false}
  if(!workspaceId)await ensureWorkspace();
  return !!workspaceId;
}

async function startProblemWorkspace(i){
  if(!cur||!cur.problems?.[i])return;
  if(!(await ensureV13Ready()))return;
  const p=cur.problems[i],legacy=v13LegacyRef(cur.id,i);
  let {data,error}=await SB.from('cp_problems').select('*').eq('workspace_id',workspaceId).eq('client_ref',cur.id).eq('legacy_problem_ref',legacy).maybeSingle();
  if(error){console.error(error);alert('Errore nel caricamento del Workspace V13.');return}
  if(!data){
    const payload={workspace_id:workspaceId,client_ref:cur.id,legacy_problem_ref:legacy,title:p.title||'Problema',summary:p.description||'',problem_statement:p.description||'',current_handling:'',priority:mapPriorityV13(p.priority),status:mapStatusV13(p.status),current_phase:'definition'};
    const ins=await SB.from('cp_problems').insert(payload).select().single();
    if(ins.error){console.error(ins.error);alert('Non riesco a creare il Workspace V13 per questo problema.');return}
    data=ins.data;
    if(p.solution){
      await SB.from('cp_solutions').insert({workspace_id:workspaceId,client_ref:cur.id,problem_id:data.id,name:'Soluzione precedente',description:p.solution,status:p.status==='Soluzione individuata'||p.status==='In lavorazione'||p.status==='Risolto'?'selected':'candidate'});
    }
  }
  v13LegacyIndex=i;
  await loadProblemWorkspace(data.id,'overview',true);
}

async function loadProblemWorkspace(problemId,section='overview',push=true){
  if(!(await ensureV13Ready()))return;
  const {data,error}=await SB.from('cp_problems').select('*').eq('id',problemId).single();

async function loadV13AiHistory(){

async function runV13Ai(action='custom',forcedPrompt=''){
  if(v13AiBusy||!v13Problem)return;
  const panel=document.getElementById('v13AiPanel');if(panel)panel.classList.add('v13AiBusy');
  const prompt=forcedPrompt||document.getElementById('v13AiPrompt')?.value||'';
  if(action==='custom'&&!prompt.trim())return;
  const userText=v13AiActionText(action,prompt);
  try{
    await ensureV13AiThread();
    if(!v13AiHistory.length)await loadV13AiHistory();
    const historyForAi=v13AiHistory.map(x=>({role:x.role,content:x.content}));
    await saveV13AiMessage('user',userText);
    const input=document.getElementById('v13AiPrompt');if(input)input.value='';
    v13AiBusy=true;v13AiRenderHistory();
    const {data,error}=await SB.functions.invoke('clientpro-ai',{body:{problemId:v13Problem.id,mode:v13AiMode,action,prompt,history:historyForAi}});
    if(error){
      const msg=error?.context?.body?.error||error?.message||'Errore nella chiamata AI.';
      throw new Error(msg);
    }
    if(data?.error)throw new Error(data.error);
    const assistantText=(data?.answer||'')+(data?.next_step?'\nProssimo passo: '+data.next_step:'');
    const assistantMsg=await saveV13AiMessage('assistant',assistantText,data?.model||null);
    if(data?.proposal){
      const sug=await saveV13AiSuggestion(data.proposal,assistantMsg?.id||null);
      if(assistantMsg?.id&&sug){
        const m=v13AiHistory.find(x=>x.id===assistantMsg.id);if(m)m.suggestion=sug;
      }
    }
  }catch(e){
    console.error(e);
    await saveV13AiMessage('assistant','Errore temporaneo: '+(e?.message||'AI non disponibile. Riprova tra poco.'),null,'error');
  }finally{
    v13AiBusy=false;if(panel)panel.classList.remove('v13AiBusy');v13AiRenderHistory();
  }
}

}
async function approveV13AiProposal(suggestionId=null){
  let proposal=v13AiLast?.proposal,activeSuggestionId=suggestionId||v13AiSuggestionId;
  if(suggestionId){
    const msg=v13AiHistory.find(m=>m.suggestion?.id===suggestionId);
    proposal=msg?.suggestion?.payload||null;
  }
  if(!proposal||!Array.isArray(proposal.items)||!proposal.items.length)return;
  const base={workspace_id:workspaceId,client_ref:v13Problem.client_ref,problem_id:v13Problem.id};
  let table='',rows=[];
  if(proposal.target==='causes'){table='cp_problem_causes';rows=proposal.items.map(x=>({...base,title:x.title||'Causa proposta',description:x.description||'',evidence:x.evidence||'',status:'to_verify'}))}
  else if(proposal.target==='questions'){table='cp_problem_questions';rows=proposal.items.map(x=>({...base,question:x.question||'Domanda proposta',why_needed:x.why_needed||'',status:'open'}))}
